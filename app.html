// move/scale an absolute path made of M L H V Q Z
function pathXf(d, s, dx, dy){
  const tk = d.match(/[MLHVQZ]|-?\d+(?:\.\d+)?/g) || []; let out = [], cmd = '', ax = true;
  for (const t of tk){
    if (/[A-Z]/.test(t)){ cmd = t; out.push(t); ax = true; continue; }
    const v = +t;
    if (cmd === 'H'){ out.push(f1(v * s + dx)); continue; }
    if (cmd === 'V'){ out.push(f1(v * s + dy)); continue; }
    out.push(f1(ax ? v * s + dx : v * s + dy)); ax = !ax;
  }
  return out.join(' ').replace(/ (-?[\d.]+) (-?[\d.]+)/g, ' $1,$2');
}
// glyph for a letter or a whole number: path in a box, plus how to place it on the board
function traceGlyph(ch){
  const lower = /^[a-z]$/.test(ch);
  if (/^\d+$/.test(ch) && ch.length > 1){
    const ds = ch.split(''), sc = .72, step = 74;
    const d = ds.map((c, k) => pathXf(GLY[c], sc, k * step, 0)).join(' ');
    const w = (ds.length - 1) * step + 100 * sc, h = 120 * sc, S = Math.min(1.4, 250 / w);
    return { d, sc: S, tx: (360 - w * S) / 2, ty: 26 + (216 - h * S) / 2 + 4 };
  }
  return { d: GLY[ch], sc: lower ? 1.3 : 1.4, tx: lower ? 115 : 110, ty: lower ? 16 : 60 };
}

function pickSet(kid, subjects, tops){
  const g = gradeOf(kid), plan = planOf(kid);
  const want = new Set(); (subjects || ['math', 'read', 'sci', 'world']).forEach(s => (plan[s] || []).forEach(t => want.add(t)));
  let pool = SETS.filter(x => (!tops || tops.includes(x.top)) && want.has(x.top) && g >= x.g[0] && g <= x.g[1]);
  if (!pool.length){ const cand = SETS.filter(x => (!tops || tops.includes(x.top)) && (!subjects || subjects.some(s => TOPICS[s].t[x.top]))); const dist = x => g < x.g[0] ? x.g[0] - g : g > x.g[1] ? g - x.g[1] : 0; const md = Math.min(...cand.map(dist)); pool = cand.filter(x => dist(x) === md); }
  if (!pool.length) pool = SETS.filter(x => g >= x.g[0] && g <= x.g[1]);
  if (!pool.length) pool = SETS.slice(0, 2);
  const s = pick(pool); return { ...s, Al: s.A(), Bl: s.B() };
}

  const c = G.claw; if (c.pile.some(p => typeof p !== 'object')) c.pile = clawNewPile();
  let s = roomShell({ wall: '#FFE9C7', wp: 'stars', floor: '#BFD9F2', fp: 'check' });
  s += IP.shelf(40, 70, 62, `${sph(52, 60, 9, '#E8414F')}${rr(66, 52, 16, 18, 3, '#FFC63A')}${rr(84, 58, 12, 12, 2, '#34B2F0')}`) + IP.shelf(40, 130, 62, `${grp(58, 130, .35, buddySVG('bao'))}${grp(86, 130, .3, buddySVG('luna'))}`);
  s += IP.shelf(260, 70, 62, `<path d="M276,70 l6,-26 l6,26z" fill="#FF5A8C"/>${rr(290, 52, 14, 18, 3, '#3EC46B')}${sph(312, 62, 7, '#B58CFF')}`) + IP.shelf(260, 130, 62, `${grp(280, 130, .32, robotSVG('cosmo'))}${grp(306, 130, .3, buddySVG('fizz'))}`);
  s += rrS(108, 18, 144, 248, 18, '#FF6F9F') + rr(112, 22, 136, 26, 12, '#FF8FB8') + TX(180, 41, 'CLAW-O-MATIC', 13, '#fff');
  for (let k = 0; k < 9; k++) s += `<circle class="glowb" style="animation-delay:-${k * .2}s" cx="${118 + k * 15.5}" cy="50" r="2.6" fill="#FFE36B"/>`;
  s += rr(120, 56, 120, 138, 8, '#D9F2FF') + rr(120, 56, 120, 138, 8, '#fff', 'opacity=".25"') + rr(122, 160, 26, 32, 3, '#C9D3E6');
  if (GR() >= 2) s += `<rect x="146" y="186" width="92" height="7" rx="3" fill="#9AA3B8"/>${[0, 1, 2, 3, 4, 5].map(k => `<circle cx="${152 + k * 16}" cy="189.5" r="2" fill="#5F6A86"/>`).join('')}`;
  if (!c.busy) s += `<path d="M${f1(c.x)},${f1(c.y + 10)} V182" stroke="#7B5CFA" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6"/><ellipse cx="${f1(c.x)}" cy="190" rx="10" ry="3" fill="#7B5CFA" opacity=".35"/>`;
  c.pile.forEach(p => s += grp(p.x, 190, .34, clawItem(p)));
  s += rr(120, 62, 120, 4, 2, '#9AA3B8');
  const cx = c.x, cy = c.y, open = c.open ? 9 : 3;
  s += `<path d="M${f1(cx)},64 V${f1(cy - 8)}" stroke="#7A84A0" stroke-width="2"/>${rr(cx - 9, cy - 10, 18, 8, 3, '#9AA3B8')}<path d="M${f1(cx - 5)},${f1(cy - 2)} q-${open},8 -2,16 M${f1(cx + 5)},${f1(cy - 2)} q${open},8 2,16" stroke="#7A84A0" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (c.held && typeof c.held === 'object') s += grp(cx, cy + 22, .34, clawItem(c.held));
  s += `<path d="M130,60 l26,-2 M134,70 l14,-1" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
  s += rr(120, 200, 120, 54, 8, '#E8416F') + rr(124, 204, 30, 30, 4, '#2B2550') + `<circle cx="196" cy="226" r="9" fill="#2B2550"/><circle cx="196" cy="218" r="6" fill="#FFC63A"/>${rr(194, 218, 4, 10, 2, '#2B2550')}<circle cx="224" cy="224" r="8" fill="#3EC46B"/><circle cx="224" cy="222" r="8" fill="#5CD87F"/>`;
  if (c.prizeO) s += grp(139, 232, .3, clawItem(c.prizeO), 'class="jump"');
  if (G.clawStreak >= 2) s += `<g transform="translate(180,12)">${pill(`Lucky streak ×${G.clawStreak}!`, { fs: 10, bg: '#FFF6C9' })}</g>`;
  return `<svg viewBox="0 0 360 270" class="rm-svg">${s}</svg>`;
};
function clawHTML(){
  G.claw = G.claw || { x: 180, y: 76, open: true, busy: false, pile: clawNewPile(), held: null, prize: null };
  const kid = K(), pl = kid.plushies || {}, gp = kid.goldPlush || {}, caps = kid.capsules || [];
  return `<div class="rm-scene" id="clawScene">${clawScene()}</div>${sayBox(GR() >= 2 ? 'The prizes ride a moving belt! Move the claw, wait for the right moment, then press Grab!' : 'Move the claw so the purple shadow is on a prize, then press Grab!')}
  <div class="clawpad"><button class="padbtn" data-hold="-1" aria-label="Move left">◀</button><button class="btn berry big" data-act="clawGrab">Grab!</button><button class="padbtn" data-hold="1" aria-label="Move right">▶</button></div>
  <div class="field"><span class="flabel">My plushies · golden ones are rare!</span><div class="plushrow">${Object.keys(BUDDIES).map(k => `<span class="plush ${pl[k] ? '' : 'locked'} ${gp[k] ? 'goldp' : ''}">${budBox(k)}<b>${pl[k] ? '×' + pl[k] : '?'}${gp[k] ? ' ✨' + gp[k] : ''}</b></span>`).join('')}</div></div>
  <div class="field"><span class="flabel">Mystery capsules · ${caps.length} of ${CAPS.length} found</span><div class="chips">${CAPS.map(e => `<span class="chip capchip ${caps.includes(e) ? '' : 'locked'}">${caps.includes(e) ? e : '?'}</span>`).join('')}</div></div>`;
}
function clawInit(){
  let dir = 0;
  document.querySelectorAll('.padbtn').forEach(b => { b.addEventListener('pointerdown', e => { e.preventDefault(); dir = +b.dataset.hold; }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { dir = 0; })); });
  const belt = [0, 0, .5, .8, 1, 1.2, 1.4, 1.6, 1.8][GR()];
  G.every(() => { const c = G.claw; let ch = false; if (dir && !c.busy){ c.x = clamp(c.x + dir * 3, 136, 228); ch = true; } if (belt && !(c.busy && c.y > 150)){ c.pile.forEach(p => { p.x += belt; if (p.x > 232) p.x -= 100; }); ch = true; } if (ch) clawRedraw(); }, 30);
}
A.clawGrab = function(){
  const c = G.claw; if (c.busy) return; c.busy = true; c.prize = null; c.prizeO = null; rmSay('Here it goes…');
  tween(700, p => { c.y = 76 + p * 92; clawRedraw(); }, () => {
    c.open = false; clawRedraw();
    const near = c.pile.map((p, i) => ({ p, i, d: Math.abs(p.x - c.x) })).sort((a, b) => a.d - b.d)[0];
    const got = near && near.d < (GR() === 0 ? 15 : 12) && Math.random() < (GR() === 0 ? .95 : .85);
    if (got){ c.held = near.p; c.pile.splice(near.i, 1); }
    setTimeout(() => tween(700, p => { c.y = 168 - p * 92; clawRedraw(); }, () => {
      if (c.held && Math.random() < .1){ c.pile.push({ ...c.held, x: c.x }); c.held = null; G.clawStreak = 0; clawRedraw(); rmSay('Oh no, it slipped! Try again!'); c.open = true; c.busy = false; return; }
      const x0 = c.x;
      tween(600, p => { c.x = x0 + (136 - x0) * p; clawRedraw(); }, () => {
        c.open = true; const kid = K();
        if (c.held){ const it = c.held; c.held = null; c.prizeO = it; G.clawStreak = (G.clawStreak || 0) + 1;
          if (it.t === 'cap'){ const e = pick(CAPS); kid.capsules = kid.capsules || []; const isNew = !kid.capsules.includes(e); if (isNew) kid.capsules.push(e); rmSay(isNew ? `A mystery capsule! Inside is a new ${e} charm!` : `A mystery capsule with a ${e} charm! You found a bonus coin too!`); if (!isNew) kid.coins++; }
          else { kid.plushies = kid.plushies || {}; kid.plushies[it.t] = (kid.plushies[it.t] || 0) + 1; if (it.gold){ kid.goldPlush = kid.goldPlush || {}; kid.goldPlush[it.t] = (kid.goldPlush[it.t] || 0) + 1; } rmSay(it.gold ? `WOW! A rare GOLDEN ${BUDDIES[it.t].name}! ✨` : `You won a ${BUDDIES[it.t].name} plushie! 🎉`); }
          save(); playReward(it.gold ? 2 : 1, it.gold ? 'Won a golden plushie' : 'Won a prize at the Toy Shop');
          if (G.clawStreak === 3){ playReward(1, 'Lucky streak at the claw machine'); rmSay('Lucky streak! 3 in a row! Bonus coin!'); }
          if (c.pile.length < 4) c.pile.push(...clawNewPile().slice(0, 3)); reBody(clawHTML()); clawInit(); }
        else { G.clawStreak = 0; clawRedraw(); rmSay(near && near.d < 13 ? 'So close! It wiggled away.' : 'Missed! Put the purple shadow right on a prize.'); }
        c.busy = false;
      });
    }), 250);
  });
};
