<title>Chore Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a phone-shaped app column. The floating-island world is the hero; quests stack under it; chunky candy tabs at the bottom.
   Single bright daytime look by design (a kids' toy world), so colors are set explicitly for every host theme. */
:root{
  --page:#D7EEFF; --app:#F2F9FF;
  --ink:#2B2550; --ink-2:#5F5A86; --ink-3:#9A95BC;
  --card:#FFFFFF; --card-2:#F4F7FF; --line:#E2E8F7;
  --sun:#FFC63A; --sun-d:#E39A00;
  --berry:#FF5A8C; --berry-d:#D33A6B;
  --leaf:#3EC46B; --leaf-d:#23994C;
  --grape:#7B5CFA; --grape-d:#5A3FD6;
  --sea:#34B2F0; --sea-d:#1A8CCB;
  --danger:#EF4E4B; --danger-d:#C23230;
  --display:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--page) radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px) 0 0/46px 46px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--grape);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#E9F6FF 0%,var(--app) 40%,#FFF8EE 100%);overflow:hidden}
@media (min-width:560px){#app{box-shadow:0 0 0 1px #c9e2f7,0 30px 80px -20px rgba(43,37,80,.35)}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.02em;margin-right:auto}
.brand svg{width:28px;height:28px}
.brand span b{color:var(--berry)}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button.parent[aria-pressed="true"]{background:var(--grape)}

.kidstrip{display:flex;align-items:center;gap:10px;padding-block:4px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.avatar{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#CFEAFF);box-shadow:0 3px 0 #a9d3f2,inset 0 0 0 3px #fff;overflow:hidden;flex:none}
.avatar svg{width:100%;height:100%}
.kidname{min-width:0;flex:1;text-align:left}
.kidname h1{font-size:21px}
.kidname small{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.wallet{display:flex;align-items:center;gap:6px;background:#fff;padding:5px 12px 5px 6px;border-radius:999px;box-shadow:0 3px 0 #F1C46B,inset 0 0 0 2px #FFE7A6;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.wallet svg{width:28px;height:28px}
.wallet.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}

main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:2px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}

/* ---------- tabs ---------- */
nav#tabs{display:flex;justify-content:space-around;background:#fff;border-top:1.5px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:11.5px;color:var(--ink-3);padding:4px 0;border-radius:16px;position:relative}
nav#tabs button svg{width:26px;height:26px}
nav#tabs button[aria-current="page"]{color:var(--ink)}
nav#tabs button[aria-current="page"] .ti{background:var(--tc,#FFE38A);transform:translateY(-2px)}
.ti{display:grid;place-items:center;width:46px;height:32px;border-radius:12px;transition:transform .15s}
.badge{position:absolute;top:0;right:calc(50% - 26px);background:var(--berry);color:#fff;font-size:11px;font-weight:900;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #fff}

/* ---------- buttons ---------- */
.btn{--b:var(--leaf);--bd:var(--leaf-d);display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--b);color:#fff;font-family:var(--display);font-weight:800;font-size:16px;padding:9px 16px 8px;border-radius:16px;box-shadow:0 4px 0 var(--bd),0 8px 14px -6px rgba(43,37,80,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{--b:#D9DEEC;--bd:#BCC3D8;color:#fff;cursor:not-allowed}
.btn.sun{--b:var(--sun);--bd:var(--sun-d);color:#5a3a00}
.btn.berry{--b:var(--berry);--bd:var(--berry-d)}
.btn.grape{--b:var(--grape);--bd:var(--grape-d)}
.btn.sea{--b:var(--sea);--bd:var(--sea-d)}
.btn.red{--b:var(--danger);--bd:var(--danger-d)}
.btn.ghost{--b:#fff;--bd:#D5DCEE;color:var(--ink)}
.btn.small{font-size:14px;padding:6px 12px 5px;border-radius:13px}
.btn.big{font-size:19px;padding:13px 20px 12px;border-radius:20px;width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.coinchip{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;color:#8A5A00;background:#FFF2C4;border-radius:999px;padding:1px 9px 0 3px;font-size:15px;font-variant-numeric:tabular-nums}
.coinchip svg{width:18px;height:18px}

/* ---------- world ---------- */
.world-wrap{position:relative;width:100%;aspect-ratio:476/452;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#6FC4FF 0%,#A9DDFF 45%,#DDF3FF 80%,#F3FBFF 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 14px 30px -14px rgba(30,80,140,.45);flex:none;max-width:100%}
.world-wrap > svg.world{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.skysun{position:absolute;top:5%;right:7%;width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFFBE0,#FFE36B 55%,#FFC93A);box-shadow:0 0 0 10px rgba(255,236,140,.35),0 0 60px 20px rgba(255,230,120,.55);z-index:0}
.rainbow{position:absolute;left:-10%;top:20%;width:70%;z-index:0;opacity:.55}
.cloud{position:absolute;z-index:1;animation:drift linear infinite;filter:drop-shadow(0 6px 6px rgba(80,140,200,.18))}
.cloud.front{z-index:3;opacity:.92}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.hud{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:999px;padding:5px 10px 5px 6px;font-weight:900;font-size:12.5px;box-shadow:0 3px 10px -3px rgba(43,37,80,.25)}
.hud.tl{top:10px;left:10px}.hud.tr{top:10px;right:10px}
.hud svg{width:20px;height:20px;flex:none}
.meter{width:62px;height:9px;border-radius:9px;background:#E7EAF6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FF8A3D,#FFC63A 50%,#3EC46B)}
.workbar{position:absolute;z-index:4;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(43,37,80,.82);color:#fff;border-radius:16px;padding:8px 12px;font-weight:800;font-size:13px;backdrop-filter:blur(6px)}
.workbar .dot{width:9px;height:9px;border-radius:50%;background:#7CFFB0;box-shadow:0 0 0 0 #7CFFB0;animation:ping 1.4s infinite;flex:none}
.workbar.tired .dot{background:#FFB36B;animation:none}
.workbar span{flex:1;min-width:0}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,255,176,.8)}100%{box-shadow:0 0 0 10px rgba(124,255,176,0)}}
.bob{animation:bob .42s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.workwiggle{animation:wiggle .7s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.smoke{animation:smoke 3.2s ease-out infinite;opacity:0}
.smoke.s2{animation-delay:1.1s}.smoke.s3{animation-delay:2.2s}
@keyframes smoke{0%{opacity:.0;transform:translate(0,0) scale(.6)}20%{opacity:.75}100%{opacity:0;transform:translate(8px,-34px) scale(1.6)}}
.spray{stroke-dasharray:3 5;animation:spray .6s linear infinite}
@keyframes spray{to{stroke-dashoffset:-16}}
.fall{stroke-dasharray:10 8;animation:fallw .7s linear infinite}
@keyframes fallw{to{stroke-dashoffset:-36}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d2{animation-delay:.5s}.twinkle.d3{animation-delay:1s}
@keyframes twinkle{50%{transform:scale(.4);opacity:.3}}
.rise{animation:rise 2.4s ease-in infinite;transform-box:fill-box}
.rise.d2{animation-delay:.8s}.rise.d3{animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.spin{animation:spinr 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinr{to{transform:rotate(360deg)}}
.bubble-pop{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.hit{fill:transparent;cursor:pointer}
.building .hit.free{fill:rgba(255,255,255,.22);stroke:#fff;stroke-width:1.6;stroke-dasharray:5 4}
.building .hit.free:hover{fill:rgba(255,255,255,.5)}
.building .hit.used:hover{fill:rgba(255,90,140,.18);stroke:#FF5A8C;stroke-width:2}
.building .hit.path{cursor:not-allowed}
.building.armed .hit.free{fill:rgba(255,230,120,.38);stroke:#FFC63A;animation:armed 1s ease-in-out infinite}
@keyframes armed{50%{fill:rgba(255,230,120,.12)}}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 2px 0 var(--line),0 10px 24px -16px rgba(43,37,80,.3)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:-4px}
.sec-h h2{font-size:23px}
.sec-h small{font-weight:800;color:var(--ink-3);font-size:13px}
.talk{display:flex;align-items:center;gap:10px}
.talk .bud{width:74px;height:74px;flex:none}
.talk .say{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--line),0 8px 18px -12px rgba(43,37,80,.35);min-width:0}
.talk .say:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.talk .say b{color:var(--berry)}
.talk .say small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}

.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:11px 12px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px rgba(43,37,80,.35)}
.qicon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.qicon svg{width:34px;height:34px}
.qbody{flex:1;min-width:0}
.qbody h3{font-size:17.5px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;font-weight:800;color:var(--ink-3);margin-top:2px}
.qmeta .late{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.wait{background:#FFF1C9;color:#93610A}
.pill.ok{background:#DDF8E6;color:#1D7A3E}
.pill.miss{background:#FFE1E1;color:#B42B2B}
.pill.req{background:#ECE6FF;color:#5A3FD6}
.quest.done{opacity:.8}
.quest.done h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#9fe0b5}
.stars{color:#FFB800;letter-spacing:1px;font-size:13px}
.ring{width:44px;height:44px;flex:none}

.learn{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#FFF6D8,#FFE9F1);}
.learn .tag{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#C0567B}
.learn h3{font-size:18px}
.answers{display:flex;flex-direction:column;gap:7px}
.answers button{background:#fff;border-radius:14px;padding:9px 12px;text-align:left;font-weight:800;box-shadow:0 3px 0 #EBD9C4}
.answers button.right{background:#DDF8E6;box-shadow:0 3px 0 #9fe0b5}
.answers button.wrong{background:#FFE1E1;box-shadow:0 3px 0 #f3b3b3}

/* ---------- market / grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:#fff;border-radius:22px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px rgba(43,37,80,.35);position:relative}
.thumb{border-radius:16px;aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#fff,#DFF2FF);overflow:hidden}
.thumb svg{width:100%;height:100%}
.item h4{font-size:15.5px}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.item .tagx{position:absolute;top:14px;left:14px;max-width:calc(100% - 28px);font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;background:#E7F7FF;color:#1A8CCB;text-transform:uppercase;letter-spacing:.06em}
.item .tagx.hol{background:#FFE4E4;color:#D2363B}
.item .tagx.own{background:#DDF8E6;color:#1D7A3E}
.tray{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.tray button{flex:none;width:92px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 3px 0 var(--line);scroll-snap-align:start;font-weight:800;font-size:12px}
.tray button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun),0 3px 0 var(--sun-d)}
.tray .thumb{aspect-ratio:1}

/* ---------- me & buddies ---------- */
.me{display:flex;gap:12px;align-items:center}
.me .stage{width:44%;flex:none;aspect-ratio:3/4;border-radius:22px;background:radial-gradient(ellipse 60% 14% at 50% 90%,#A9DE8F 0 70%,transparent 72%),linear-gradient(180deg,#BFE6FF,#EAF7FF 75%,#D9F2C8);display:grid;place-items:center}
.me .stage svg{width:100%;height:100%}
.opts{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.opts label{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 2px #fff}
.sw[aria-pressed="true"]{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 2px #fff,0 0 0 4.5px var(--ink)}
.buddycard .thumb{background:radial-gradient(circle at 50% 35%,#fff,#FFEAF2)}
.buddycard.active{box-shadow:0 0 0 3px var(--berry),0 3px 0 var(--berry-d)}
.lvl{font-size:12px;font-weight:900;color:var(--grape)}
.buddycard p{font-size:12.5px;color:var(--ink-2);font-weight:600}
.locked svg{filter:grayscale(1) brightness(.4) opacity(.35)}

/* ---------- parent ---------- */
.p-hero{background:linear-gradient(135deg,#7B5CFA,#9C7BFF 60%,#C08CFF);color:#fff;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 24px -14px rgba(90,63,214,.7)}
.p-hero h2{font-size:24px}
.p-hero p{font-weight:700;opacity:.9;font-size:14px}
.inbox{display:flex;flex-direction:column;gap:12px}
.appr{display:flex;flex-direction:column;gap:10px}
.appr-top{display:flex;gap:10px;align-items:center}
.appr-top .avatar{width:42px;height:42px}
.appr-top h3{font-size:18px}
.appr-top small{font-weight:800;color:var(--ink-3);font-size:12.5px}
.note{background:var(--card-2);border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px}
.note b{font-family:var(--display)}
.proof{display:flex;gap:8px}
.proof figure{margin:0;flex:1;min-width:0}
.proof img,.proof .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--card-2);display:grid;place-items:center;color:var(--ink-3);font-weight:800;font-size:12px;text-align:center}
.proof figcaption{font-size:11.5px;font-weight:800;color:var(--ink-3);margin-top:3px}
.starpick{display:flex;gap:2px}
.starpick button{font-size:30px;line-height:1;color:#DDE2EF;padding:0 2px;transition:transform .1s}
.starpick button.on{color:#FFB800;text-shadow:0 2px 0 #E39A00}
.starpick button:active{transform:scale(1.25)}
.breakdown{display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-weight:700;color:var(--ink-2);background:#FFFBEA;border-radius:14px;padding:9px 12px;font-variant-numeric:tabular-nums}
.breakdown div{display:flex;justify-content:space-between;gap:8px}
.breakdown .tot{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);border-top:1.5px dashed #F0DA9A;padding-top:4px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 10px;box-shadow:0 2px 0 var(--line)}
.trow .qicon{width:42px;height:42px;border-radius:14px}
.trow .qicon svg{width:28px;height:28px}
.trow h4{font-size:15.5px}
.trow .qmeta{font-size:12px}
.warnbox{border-radius:20px;padding:12px;background:#FFF0EE;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1.5px #FFD3CE}
.warnbox h3{font-size:17px;color:#B42B2B}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card-2);border-radius:16px;padding:9px 10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-weight:800;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.week div{background:var(--card-2);border-radius:12px;padding:6px 0;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.week div.has{background:#DDF8E6;color:#1D7A3E}
.week div.today{box-shadow:inset 0 0 0 2px var(--leaf)}
.week small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:800}
.hist{display:flex;flex-direction:column;gap:2px;font-size:13.5px;font-weight:700}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border:0}
.hist .plus{color:var(--leaf-d);font-variant-numeric:tabular-nums}
.hist .minus{color:var(--danger);font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow div{min-width:0}
.setrow b{display:block;font-size:15px}
.setrow small{display:block;color:var(--ink-3);font-weight:700;font-size:12.5px}
.tog{width:50px;height:30px;border-radius:30px;background:#D5DCEE;position:relative;flex:none;transition:background .15s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .15s}
.tog[aria-pressed="true"]{background:var(--leaf)}
.tog[aria-pressed="true"]:after{transform:translateX(20px)}
.tog:disabled{opacity:.45;cursor:not-allowed}
.num{width:74px;padding:7px 8px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-weight:800;text-align:center;background:#fff;color:var(--ink)}
input[type=time].num{width:104px}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(32,24,70,.42);backdrop-filter:blur(3px);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--app);border-radius:30px 30px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(60%)}}
.grab{width:44px;height:5px;border-radius:5px;background:#CBD3EA;margin:2px auto 0}
.sheet h3{font-size:22px}
.sheet .sub{color:var(--ink-2);font-weight:700;font-size:14px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.flabel{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.text{width:100%;padding:11px 13px;border-radius:15px;border:1.5px solid var(--line);font:inherit;font-weight:700;background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:6px;background:#fff;border-radius:15px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.stepper button{width:34px;height:34px;border-radius:11px;background:var(--card-2);font-weight:900;font-size:18px}
.stepper output{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.iconpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.iconpick button{aspect-ratio:1;border-radius:15px;display:grid;place-items:center}
.iconpick button svg{width:62%;height:62%}
.iconpick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.actgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actgrid button{background:#fff;border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:12.5px;line-height:1.15;text-align:center}
.actgrid button .thumb{width:100%;background:radial-gradient(circle at 50% 30%,#fff,#E3F5FF)}
.actgrid button small{font-weight:700;color:var(--ink-3);font-size:11px}
.actgrid button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--leaf),0 3px 0 var(--leaf-d)}
.actgrid button:disabled{opacity:.55;cursor:not-allowed}
.photo-in{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;cursor:pointer}
.photo-in input{position:absolute;opacity:0;width:1px;height:1px}
.photo-in img{width:54px;height:54px;border-radius:12px;object-fit:cover}
.photo-in .cam{width:54px;height:54px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;flex:none}
.scene{border-radius:22px;overflow:hidden;box-shadow:0 10px 20px -12px rgba(43,37,80,.45)}
.scene svg{display:block;width:100%;height:auto}
.catch{position:relative;height:190px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#2F2A6B,#5A4BB8 70%,#8E6CF0);touch-action:manipulation}
.catch-hud{position:absolute;inset:8px 10px auto;display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:13.5px;z-index:2;pointer-events:none}
.catch-hud b{font-family:var(--display);font-size:20px;line-height:1}
.catch .st{position:absolute;top:-40px;width:42px;height:42px;display:grid;place-items:center;animation:starfall linear forwards}
.catch .st svg{width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(255,230,120,.9))}
.catch .st.got{animation:gotit .35s forwards}
@keyframes starfall{to{transform:translateY(250px) rotate(200deg)}}
@keyframes gotit{to{transform:scale(2);opacity:0}}
.catch .bud{position:absolute;bottom:-4px;left:50%;width:70px;margin-left:-35px;pointer-events:none}
.catch .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;text-align:center;z-index:3;padding:0 20px}

/* ---------- toasts, nudges, celebration ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;max-width:448px;width:100%;background:rgba(255,255,255,.97);border-radius:22px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 34px -10px rgba(43,37,80,.45);animation:drop .35s cubic-bezier(.2,1.4,.4,1);font-weight:800;font-size:14px}
.toast.out{animation:lift .3s forwards}
@keyframes drop{from{transform:translateY(-120%)}}
@keyframes lift{to{transform:translateY(-140%);opacity:0}}
.toast .ico{width:42px;height:42px;border-radius:13px;background:#FFEAF2;flex:none;display:grid;place-items:center;overflow:hidden}
.toast .ico svg{width:100%;height:100%}
.toast .tx{flex:1;min-width:0}
.toast .tx small{display:block;font-size:11px;color:var(--ink-3);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.toast .btn{flex:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.flycoin{position:fixed;width:34px;height:34px;left:0;top:0;will-change:transform}
.confetti{position:fixed;width:9px;height:14px;border-radius:2px;top:0;left:0}
.celebrate{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,240,170,.6),rgba(43,37,80,.55));animation:fade .2s;padding:24px}
.cele-card{background:#fff;border-radius:32px;padding:18px 22px 20px;text-align:center;max-width:320px;width:100%;box-shadow:0 30px 60px -20px rgba(43,37,80,.6);animation:boing .55s cubic-bezier(.2,1.6,.4,1);position:relative}
.cele-card .rays{position:absolute;inset:-60px;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 12s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes boing{from{transform:scale(.3)}}
.cele-card .bud{width:120px;height:120px;margin:-70px auto 0;display:block}
.cele-card h2{font-size:40px;color:var(--sun-d);text-shadow:0 3px 0 #FFE7A6}
.cele-card p{font-weight:800;color:var(--ink-2)}
.cele-card .stars{font-size:24px}
.empty{text-align:center;padding:26px 16px;color:var(--ink-2);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:110px;height:110px}
.empty h3{font-size:20px;color:var(--ink)}
.note-s{font-size:12.5px;color:var(--ink-3);font-weight:700}
/* ---------- v2: accounts, big world, robots, chat ---------- */
.world-wrap > svg.world{touch-action:pan-y;cursor:grab}
.world-wrap.tall{aspect-ratio:auto;height:max(380px,calc(100dvh - 330px))}
.world-wrap.tall > svg.world{touch-action:none}
.wctl{position:absolute;z-index:5;right:10px;top:50px;display:flex;flex-direction:column;gap:6px}
.wctl button{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.94);font-family:var(--display);font-weight:800;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 #C9D6EE,0 6px 12px -6px rgba(43,37,80,.4)}
.hud.bl{left:10px;bottom:10px;top:auto}
.hover{animation:hov 2.4s ease-in-out infinite}
@keyframes hov{50%{transform:translateY(-4px)}}
.glowb{animation:glowb 1.4s ease-in-out infinite}
@keyframes glowb{50%{opacity:.35}}
.wave{animation:wavey 3s ease-in-out infinite}
@keyframes wavey{0%,100%{opacity:.15}50%{opacity:.85}}
.bobw{animation:bobw 2.6s ease-in-out infinite}
@keyframes bobw{50%{transform:translateY(-3px) rotate(1.5deg)}}
.tapring{animation:tapring .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes tapring{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.waveArm{animation:waveArm .9s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes waveArm{50%{transform:rotate(-22deg)}}
.profile{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 12px 3px 3px;font-weight:800;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.avatar.mini{width:30px;height:30px;box-shadow:none;display:inline-block}
.pav{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#7B5CFA,#B08CFF);color:#fff;font-family:var(--display);font-weight:800;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.mailbtn{position:relative;width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #F3C3D3,inset 0 0 0 2px #FFE0EA;flex:none}
.mailbtn .badge{top:-5px;right:-5px}
.auth{display:flex;flex-direction:column;gap:12px}
.auth.card{padding:18px}
.auth h2{font-size:26px}
.auth .sub{color:var(--ink-2);font-weight:700}
.welcome{text-align:center;padding-block:6px 10px}
.welcome h1{font-size:34px;color:var(--ink)}
.welcome > p{font-weight:700;color:var(--ink-2);font-size:15.5px;max-width:38ch;margin:0 auto}
.hero-art{border-radius:30px;background:linear-gradient(180deg,#7FCBFF,#CDEBFF 70%,#EAF7FF);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.hero-art svg{display:block;width:100%;height:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--grape);margin-top:1px}
.err{color:var(--danger-d);font-weight:800;font-size:14px}
.who{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.who h1{font-size:34px}
.who .sub{color:var(--ink-2);font-weight:700;margin-top:-8px}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.who-t{background:#fff;border-radius:26px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 var(--line),0 12px 24px -16px rgba(43,37,80,.4);transition:transform .1s}
.who-t:active{transform:scale(.97)}
.who-t b{font-family:var(--display);font-size:20px}
.who-t small{font-weight:800;color:var(--ink-3);font-size:12px}
.who-av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 30%,#fff,#CFEAFF);display:grid;place-items:center}
.who-av svg{width:100%;height:100%}
.who-av.sm{width:56px;height:56px;flex:none}
.pinhead{display:flex;align-items:center;gap:12px}
.pindots{display:flex;justify-content:center;gap:14px;padding:6px 0}
.pindots i{width:18px;height:18px;border-radius:50%;background:#DDE3F2}
.pindots i.on{background:var(--grape)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pinpad button{height:62px;border-radius:20px;background:#fff;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 4px 0 var(--line)}
.pinpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.looks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.looks.bud{grid-template-columns:repeat(3,minmax(0,1fr))}
.looks button{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#DDEFFF);overflow:hidden;box-shadow:inset 0 0 0 2px #fff}
.looks.bud button{border-radius:20px;aspect-ratio:auto;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12.5px}
.looks.bud button svg{width:70%}
.looks button svg{width:100%;height:100%}
.looks button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--grape)}
.robo-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.robo{flex:none;width:118px;background:#fff;border-radius:22px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px rgba(43,37,80,.35);scroll-snap-align:start;text-align:center}
.robo .rb{width:76px;height:96px;display:block}
.robo .rb svg{width:100%;height:100%}
.robo b{font-family:var(--display);font-size:16px}
.robo small{font-size:11.5px;font-weight:700;color:var(--ink-3);line-height:1.15;min-height:2.3em}
.robohead{display:flex;align-items:center;gap:12px}
.rbig{width:96px;height:124px;flex:none;border-radius:22px;background:radial-gradient(circle at 50% 70%,#E6F7FF,#fff 70%)}
.rbig svg{width:100%;height:100%}
.lesson{background:#fff;border-radius:20px;padding:12px 14px;font-weight:700;font-size:16px;line-height:1.45;display:flex;flex-direction:column;gap:8px;align-items:flex-start;box-shadow:0 2px 0 var(--line)}
.feedback{font-weight:800;color:var(--ink-2)}
.feedback.ok{color:var(--leaf-d)}
.chat{display:flex;flex-direction:column;gap:10px;padding:12px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:46vh;min-height:140px;overflow-y:auto;padding:4px 2px}
.sheet .thread{max-height:38vh;background:#fff;border-radius:20px;padding:10px}
.thread .msg{display:flex;align-items:flex-end;gap:7px;max-width:86%}
.thread .msg.me{align-self:flex-end;flex-direction:row-reverse}
.thread .mb{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.thread .msg.me .mb{align-items:flex-end}
.thread .bt{background:var(--card-2);border-radius:18px 18px 18px 6px;padding:8px 12px;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.thread .msg.me .bt{background:var(--grape);color:#fff;border-radius:18px 18px 6px 18px}
.thread small{font-size:11px;font-weight:700;color:var(--ink-3)}
.giftchip{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:12.5px;background:#FFF2C4;color:#8A5A00;border-radius:999px;padding:2px 9px 2px 3px}
.stkrow{display:flex;gap:6px;overflow-x:auto;padding:2px}
.stkrow button{flex:none;width:52px;height:52px;border-radius:15px;background:var(--card-2);display:grid;place-items:center}
.giftrow{align-items:center}
.composer{display:flex;gap:8px}
.composer .text{flex:1;min-width:0}
.dotn{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--berry);color:#fff;font-size:11px}

/* ---------- v3: inside every place ---------- */
#room{position:fixed;top:0;bottom:0;left:0;right:0;z-index:60;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#FFF4FA 0%,#F2F9FF 60%,#FFF8EE 100%);padding-top:env(safe-area-inset-top,0px);animation:roomIn .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes roomIn{from{transform:scale(.94);opacity:0}}
.rm-top{display:flex;align-items:center;gap:10px;padding-block:10px 8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.rm-back{display:flex;align-items:center;gap:2px;background:#fff;border-radius:999px;padding:7px 13px 7px 8px;font-weight:900;font-size:13.5px;color:var(--ink);box-shadow:0 3px 0 var(--line);flex:none}
.rm-title{flex:1;min-width:0}
.rm-title h2{font-size:21px}
.rm-title small{display:block;font-weight:800;color:var(--ink-3);font-size:12px}
.wallet.sm{font-size:17px;padding:3px 10px 3px 4px;box-shadow:0 2px 0 #F1C46B,inset 0 0 0 2px #FFE7A6}
.wallet.sm svg{width:22px;height:22px}
.rm-tabs,.rm-subtabs{display:flex;gap:6px}
.rm-tabs{padding-block:0 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rm-tabs button,.rm-subtabs button{flex:1;padding:8px 6px;border-radius:14px;background:#fff;font-weight:900;font-size:13.5px;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.rm-tabs button[aria-pressed="true"],.rm-subtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.rm-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:2px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.rm-scene{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 12px 24px -14px rgba(43,37,80,.45),inset 0 0 0 3px rgba(255,255,255,.5);flex:none;background:#fff}
.rm-svg{display:block;width:100%;height:auto}
.rmsay-wrap{display:flex;align-items:center;gap:8px}
.rmsay-av{width:54px;height:54px;flex:none}
.rmsay-av svg{width:100%;height:100%}
.rmsay-av .pav{width:44px!important;height:44px!important}
.rmsay{background:#fff;border-radius:18px;padding:9px 13px;font-weight:800;font-size:14.5px;box-shadow:0 2px 0 var(--line);flex:1;min-width:0}
.rmsay b{color:var(--berry)}
.rmsay.pop{animation:pop2 .35s}
@keyframes pop2{40%{transform:scale(1.04)}}
.center{text-align:center}
.topgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.topbtn{background:#fff;border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12.5px;box-shadow:0 3px 0 var(--line)}
.topbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bakeaway{animation:bake 1s forwards}
@keyframes bake{to{transform:translate(90px,-70px) scale(.2);opacity:0}}
.jump{animation:jump .7s ease-out infinite}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-10px)}}
.jump-in{animation:jin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes jin{from{transform:scale(.88)}}
.slidedown{animation:slided 1.3s ease-in}
@keyframes slided{from{transform:translate(56px,-60px)}to{transform:none}}
.snowf{animation:snowf 4s linear infinite}
@keyframes snowf{to{transform:translateY(66px)}}
.memgrid{display:grid;gap:8px}
.mcard{aspect-ratio:3/4;perspective:700px;border-radius:14px;padding:0}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 3px 0 rgba(43,37,80,.12)}
.mc-back{background:linear-gradient(135deg,#34B2F0,#7B5CFA)}
.mc-front{background:#fff;transform:rotateY(180deg)}
.mcard.done .mc-front{background:#DDF8E6;box-shadow:0 0 0 3px #3EC46B}
.mc-back svg,.mc-front svg{width:72%;height:72%}
.seedrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seed{background:#fff;border-radius:14px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:10.5px;box-shadow:0 3px 0 var(--line)}
.seed svg{width:100%;height:44px}
.seed[aria-pressed="true"]{box-shadow:0 0 0 3px var(--leaf),0 3px 0 var(--leaf-d)}
.potg{cursor:pointer}
.rm-scene.decor svg{touch-action:none}
.fur{cursor:grab}
.fur.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #FFC63A)}
.decor-tools{position:static;margin:6px;display:flex;gap:6px;align-items:center;background:rgba(43,37,80,.86);color:#fff;border-radius:16px;padding:6px 8px;font-size:13px;backdrop-filter:blur(4px)}
.decor-tools b{flex:1;min-width:0;font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decor-tools button{background:rgba(255,255,255,.18);color:#fff;padding:6px 10px;border-radius:10px;font-weight:800;font-size:13px;white-space:nowrap}
.decor-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.furgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.furbtn{background:#fff;border-radius:16px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;line-height:1.2;box-shadow:0 3px 0 var(--line);text-align:center}
.furbtn .ft{width:100%;aspect-ratio:1.15;display:block;background:radial-gradient(circle at 50% 40%,#fff,#FFF0F6);border-radius:12px}
.furbtn svg{width:100%;height:100%}
.furbtn small{font-size:11px;color:var(--ink-3);font-weight:700}
.furbtn:disabled{opacity:.5;cursor:not-allowed}
.decor-panel{display:flex;flex-direction:column;gap:10px}
.pool{touch-action:manipulation}
.duck{position:absolute;width:14%;aspect-ratio:48/40;padding:0;z-index:2}
.duck svg{width:100%;height:100%;pointer-events:none}
@keyframes swimR{from{left:-15%}to{left:104%}}
@keyframes swimL{from{left:104%}to{left:-15%}}
@keyframes duckgot{to{transform:scale(1.8) translateY(-20px);opacity:0}}
.pool-hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.pool-hud span{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.pool-start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,37,80,.22);z-index:4}
.pool-res{background:#fff;border-radius:22px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;box-shadow:0 14px 30px -12px rgba(43,37,80,.5)}
.pool-res b{font-family:var(--display);font-size:30px;color:var(--sun-d)}
.stack-wrap{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 12px 24px -14px rgba(43,37,80,.45);touch-action:manipulation;max-width:320px;width:100%;margin:0 auto;flex:none}
.stack-svg{display:block;width:100%;height:auto}
.storycard{background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 var(--line),0 12px 24px -16px rgba(43,37,80,.4)}
.story-art{display:block;width:100%;height:auto;border-radius:16px}
.storycard h3{font-size:22px;color:var(--grape)}
.storycard p{font-size:16.5px;font-weight:700;line-height:1.5}
.shelf{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;align-items:flex-end}
.spine{writing-mode:vertical-rl;transform:rotate(180deg);height:124px;width:38px;border-radius:6px;color:#fff;font-weight:800;font-size:12px;padding:8px 0;flex:none;box-shadow:inset -5px 0 0 rgba(0,0,0,.12)}
.clawpad{display:flex;gap:10px;align-items:center}
.padbtn{width:64px;height:56px;border-radius:18px;background:#fff;font-size:22px;color:var(--ink);box-shadow:0 4px 0 var(--line);flex:none;touch-action:none;-webkit-user-select:none;user-select:none}
.padbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.clawpad .btn{flex:1}
.plushrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.plush{background:#fff;border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 var(--line);font-size:12px}
.plush svg{width:100%;height:54px}
.plush.locked svg{filter:grayscale(1) brightness(.5) opacity(.35)}
.cookie-wrap{max-width:330px;width:100%;margin:0 auto;border-radius:26px;overflow:hidden;box-shadow:0 12px 24px -14px rgba(43,37,80,.45);background:#FFF6EC;flex:none}
#cookieCv,#craftCv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.jar{display:flex;gap:8px;flex-wrap:wrap}
.jar img{width:72px;height:72px;border-radius:50%;box-shadow:0 3px 0 var(--line);background:#fff}
.pushhint{position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.8);background:#FF5A8C;color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;opacity:0;transition:opacity .1s,transform .1s;pointer-events:none}
.pushhint.on{opacity:1;transform:translateX(-50%) scale(1.05)}
.floatc{position:fixed;z-index:95;display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;color:#C98A00;font-size:18px;animation:floatc 1.4s ease-out forwards;pointer-events:none}
@keyframes floatc{to{transform:translateY(30px);opacity:0}}
.robo.place .rb.pl{width:98px;height:98px}
#view > *,.rm-body > *,.sheet > *{flex-shrink:0}

/* ---------- v4: seasonal events ---------- */
.sky-night{background:linear-gradient(180deg,#141844 0%,#2E2C7A 55%,#5B4FB8 100%)}
.sky-dusk{background:linear-gradient(180deg,#4B2F84 0%,#B45A9E 45%,#FF9A5A 80%,#FFD6A0 100%)}
.sky-snow{background:linear-gradient(180deg,#A9CBEA 0%,#D6E8F7 55%,#F4FAFF 100%)}
.sky-autumn{background:linear-gradient(180deg,#8FCBEF 0%,#CFE4EE 50%,#FFE2BF 100%)}
.sky-pink{background:linear-gradient(180deg,#FFB3D0 0%,#FFD6E6 55%,#FFF0F6 100%)}
.sky-spring{background:linear-gradient(180deg,#8FD6FF 0%,#C9ECFF 50%,#F2FFE9 100%)}
.sky-summer{background:linear-gradient(180deg,#36A8F5 0%,#8FD6FF 50%,#FFF0B8 100%)}
.sky-lucky{background:linear-gradient(180deg,#7FD6A8 0%,#C4F0D4 50%,#F4FFF2 100%)}
.sky-night .skysun,.sky-dusk .skysun{background:radial-gradient(circle at 40% 38%,#FFFDF0,#F3EBC4 60%,#D9CC9A);box-shadow:0 0 30px 10px rgba(255,250,210,.35)}
.sky-night .rainbow,.sky-dusk .rainbow,.sky-snow .rainbow,.sky-autumn .rainbow,.sky-summer .rainbow{display:none}
.sky-night .cloud,.sky-dusk .cloud{opacity:.45}
.evfx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.evfx i{position:absolute;top:-6%;display:block}
.p-snow{width:calc(7px*var(--s));height:calc(7px*var(--s));border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.9);animation:fallSway linear infinite}
.p-leaf{width:calc(13px*var(--s));height:calc(9px*var(--s));border-radius:0 80% 0 80%;animation:fallSpin linear infinite}
.p-clov{background:none!important;width:calc(18px*var(--s));height:calc(18px*var(--s));border-radius:0}
.p-clov svg,.p-heart svg{width:100%;height:100%;display:block}
.p-petal{width:calc(10px*var(--s));height:calc(7px*var(--s));border-radius:60% 40% 60% 40%;animation:fallSpin linear infinite}
.p-heart{top:auto!important;bottom:-8%;width:calc(17px*var(--s));height:calc(17px*var(--s));animation:riseUp linear infinite}
.p-bub{top:auto!important;bottom:-8%;width:calc(13px*var(--s));height:calc(13px*var(--s));border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.1) 40%,transparent 60%);animation:riseUp linear infinite}
.p-glint{width:6px;height:6px;background:#FFE36B;border-radius:50%;box-shadow:0 0 8px #FFE36B;animation:twk 1.8s ease-in-out infinite}
.p-bat{left:-12%;width:38px;height:19px;animation:batFly linear infinite}
.p-bat svg{width:100%;height:100%;display:block;animation:flap .28s ease-in-out infinite alternate}
.p-fw{width:76px;height:76px;margin:-38px;animation:fw 2.6s ease-out infinite}
.p-fw svg{width:100%;height:100%;display:block}
@keyframes fallSway{0%{transform:translate(0,0)}50%{transform:translate(14px,240px)}100%{transform:translate(-6px,560px)}}
@keyframes fallSpin{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(26px,250px) rotate(200deg)}100%{transform:translate(-10px,560px) rotate(420deg)}}
@keyframes riseUp{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(18px,-560px);opacity:.2}}
@keyframes batFly{0%{transform:translate(0,0)}25%{transform:translate(130px,-20px)}50%{transform:translate(260px,10px)}75%{transform:translate(390px,-16px)}100%{transform:translate(580px,0)}}
@keyframes flap{to{transform:scaleY(.35)}}
@keyframes fw{0%{transform:scale(.1);opacity:0}15%{opacity:1}60%{transform:scale(1);opacity:.95}100%{transform:scale(1.15);opacity:0}}
@keyframes twk{50%{transform:scale(.3);opacity:.3}}
.evcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--c1),color-mix(in srgb,var(--c1) 55%,var(--c2)));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 70%,#000),0 14px 26px -14px var(--c1);position:relative;overflow:hidden}
.evcard:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.4),transparent 50%);pointer-events:none}
.evcard:active{transform:translateY(3px)}
.evart{width:58px;height:58px;flex:none;border-radius:18px;background:rgba(255,255,255,.28);display:grid;place-items:center}
.evart svg{width:46px;height:46px;animation:hov 2.4s ease-in-out infinite}
.evtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.evtx small{font-weight:800;font-size:11.5px;opacity:.92}
.evtx b{font-family:var(--display);font-size:21px;line-height:1.05}
.evtx > span{font-weight:700;font-size:13px;opacity:.95}
.evready{color:#FFF3A0;font-family:var(--body)!important;font-size:11.5px!important}
.evbar{display:block;height:8px;border-radius:8px;background:rgba(255,255,255,.35);overflow:hidden;margin:4px 0 2px}
.evbar i{display:block;height:100%;background:#fff;border-radius:8px}
.evtok{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.evtok svg{width:32px;height:32px}
.evnext{display:flex;align-items:center;gap:10px}
.evnext > span{width:44px;height:44px;flex:none}
.evnext b{display:block}
.evnext small{color:var(--ink-3);font-weight:700}
.evhero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff;flex:none}
.evhero-art{display:block;width:100%;height:auto}
.evhero-tx{position:absolute;left:14px;right:14px;top:10px;display:flex;flex-direction:column}
.evhero-tx b{font-family:var(--display);font-size:23px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.evhero-tx span{font-weight:800;font-size:12.5px}
.evhero-tok{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.94);color:var(--ink);border-radius:16px;padding:4px 10px 4px 6px;display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:20px}
.evhero-tok svg{width:28px;height:28px}
.evhero-tok small{font-family:var(--body);font-size:11px;color:var(--ink-3)}
.evhunt{display:flex;align-items:center;gap:10px;padding:10px 12px}
.evhunt-ico{width:46px;height:46px;flex:none}
.evhunt-ico svg{width:100%;height:100%}
.evhunt > div{flex:1;min-width:0}
.evhunt b{display:block}
.evhunt small{color:var(--ink-3);font-weight:700;font-size:12.5px}
.evlist{display:flex;flex-direction:column;gap:8px}
.evch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 0 var(--line)}
.evch.claimed{opacity:.62}
.evci{width:40px;height:40px;border-radius:13px;background:var(--c1);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.evci svg{width:24px;height:24px}
.evch-b{flex:1;min-width:0}
.evch-b b{display:block;font-size:14px;line-height:1.25}
.evch .evbar,.evrw-i .evbar{background:var(--line)}
.evch .evbar i,.evrw-i .evbar i{background:var(--c1)}
.evch-b small,.evrw-b small{font-weight:800;color:var(--ink-3);font-size:11.5px}
.evrew{display:flex;align-items:center;gap:2px;font-weight:900;font-size:13px;color:var(--ink-2);flex:none}
.evcal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.evcal-i{background:#fff;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 0 var(--line)}
.evcal-i span{width:30px;height:30px}
.evcal-i span svg{width:100%;height:100%}
.evcal-i b{font-size:11.5px;line-height:1.1}
.evcal-i small{font-size:10px;color:var(--ink-3);font-weight:700}
.evcal-i.on{box-shadow:0 0 0 3px var(--c1)}
.evrw{display:flex;flex-direction:column;gap:10px}
.evrw-i{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 3px 0 var(--line)}
.evrw-i .thumb{width:86px;flex:none}
.evrw-i.have{box-shadow:0 0 0 3px #3EC46B}
.evrw-b{flex:1;min-width:0}
.evrw-b b{display:block;font-family:var(--display);font-size:17px}
.evcatch{height:330px;background:linear-gradient(180deg,#8ED3FF,#E6F6FF);touch-action:none}
.ec-ground{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(#7FD266,#5DB650)}
.sky-snow .ec-ground{background:linear-gradient(#fff,#DDEBF7)}
.sky-summer .ec-ground{background:linear-gradient(#F8E4B0,#EFD08C)}
.ec-basket{position:absolute;bottom:16px;width:100px;margin-left:-50px;z-index:2}
.ec-basket svg{width:100%;height:auto;display:block}
.ec-it{position:absolute;left:0;top:0;width:36px;height:36px;z-index:1;will-change:transform}
.ec-it svg{width:100%;height:100%;display:block}
.ec-it.gold svg{filter:drop-shadow(0 0 6px #FFE36B) saturate(1.5) brightness(1.15)}
.ec-it.bad{width:46px}
.evcatch.shake{animation:shake .3s}
.evfam{display:flex;align-items:center;gap:10px;background:var(--card-2);border-radius:16px;padding:8px 10px}
.evfam span{width:32px;height:32px;flex:none}
.evfam span svg{width:100%;height:100%}
.evfam b{display:block;font-size:14px}
.evfam small{font-weight:700;color:var(--ink-3);font-size:12px}
.hunt{cursor:pointer}

/* ---------- v5: levels + wardrobe ---------- */
.lvbar{background:#fff;border-radius:18px;padding:8px 10px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:6px}
.lv-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv-head b{font-family:var(--display);font-size:19px;color:var(--grape);flex:none}
.lv-head span{font-weight:800;font-size:13px;color:var(--ink-2)}
.lv-dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.lvd{aspect-ratio:1;border-radius:10px;background:var(--card-2);font-weight:900;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.lvd i{font-style:normal;font-size:7px;color:#FFB800;letter-spacing:-1px;height:8px;margin-top:1px}
.lvd.cur{background:var(--grape);color:#fff;box-shadow:0 3px 0 var(--grape-d)}
.lvd.cur i{color:#FFE36B}
.lvd.lock{color:var(--ink-3);opacity:.6;cursor:not-allowed}
.lvdone{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,37,80,.38);z-index:6;animation:fade .2s;padding:10px}
.lvcard{background:#fff;border-radius:22px;padding:14px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 16px 30px -12px rgba(43,37,80,.5);animation:boing .5s cubic-bezier(.2,1.6,.4,1);max-width:270px}
.lvcard small{font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.lvstars{display:flex;gap:4px;font-size:38px;line-height:1}
.lvstars span{color:#DDE2EF}
.lvstars span.on{color:#FFB800;text-shadow:0 3px 0 #E39A00;animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
.lvstars span:nth-child(2){animation-delay:.15s}.lvstars span:nth-child(3){animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.lvcard .xp{color:var(--grape);font-family:var(--display);font-size:19px}
.lvcard p{font-weight:700;font-size:13.5px;color:var(--ink-2)}
.lvcard .actions{width:100%}
.memwrap{position:relative;min-height:200px}
.lvpill{display:inline-block;vertical-align:middle;margin-left:6px;background:var(--grape);color:#fff;font-size:13px;border-radius:999px;padding:2px 9px 0;font-family:var(--display);line-height:1.3;box-shadow:0 2px 0 var(--grape-d)}
.kidstrip .kidname small{display:flex;align-items:center;gap:5px;white-space:nowrap}
.xpbar{display:inline-block;width:64px;height:8px;border-radius:8px;background:#E7EAF6;overflow:hidden;flex:none}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#B49CFF,#7B5CFA);border-radius:8px}
.floatxp{position:fixed;z-index:95;font-family:var(--display);font-weight:800;color:var(--grape);font-size:17px;animation:floatc 1.4s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 #fff}
.pill.lock{background:#EEF2FB;color:#8A85AE}
.item.lockeditem .thumb svg{filter:saturate(.35) opacity(.6)}
.tagx.lvgift{background:#ECE6FF;color:#5A3FD6}
.wardrobe{display:flex;flex-direction:column;gap:10px}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wtile{background:var(--card-2);border-radius:16px;padding:4px 4px 7px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:11px;line-height:1.15;text-align:center}
.wtile svg{width:100%;height:78px}
.wtile[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 3px var(--berry)}
.rlv{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink-2)}
.rlv b{font-family:var(--display);color:var(--sea-d);flex:none}
.rlv .evbar{flex:1;background:var(--line);margin:0}
.rlv .evbar i{background:var(--sea)}
.rlv small{font-size:11.5px;color:var(--ink-3);flex:none;max-width:48%}
.lvbig{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;background:var(--grape);border-radius:50%}


/* ---------- v6: music + work ---------- */
.mbtn{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--grape);box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.mbtn[aria-pressed="true"]{animation:mpulse 2.4s ease-in-out infinite}
@keyframes mpulse{50%{box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 5px rgba(123,92,250,.15)}}
.np{color:var(--grape);font-weight:900}
.workcount{text-align:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--grape);margin-top:-4px}


/* ---------- v7: read to me ---------- */
.hearbtn{width:34px;height:34px;border-radius:50%;background:#E3F4FF;color:var(--sea-d);display:inline-grid;place-items:center;flex:none;box-shadow:0 2px 0 #B9DDF5;vertical-align:middle;padding:0}
.hearbtn:active{transform:scale(.9)}
h2 .hearbtn,h3 .hearbtn{width:28px;height:28px}
.item > .hearbtn,.furbtn > .hearbtn,.robo > .hearbtn,.evrw-i > .hearbtn{position:absolute;top:8px;right:8px;z-index:2}
.robo,.furbtn{position:relative}
.lvbar > .hearbtn,.evcard > .hearbtn,.evhunt > .hearbtn{flex:none;align-self:flex-start}
.lvbar.has-hear{position:relative}
.lvbar > .hearbtn{position:absolute;right:8px;top:6px}
.evcard > .hearbtn{position:absolute;right:10px;bottom:10px;z-index:2}
.ansrow{display:flex;gap:8px;align-items:center}
.ansrow > button:last-child{flex:1}
.thread .mb > .hearbtn{width:26px;height:26px}
.hearagain{position:fixed;z-index:75;right:max(14px,calc(50% - 226px));bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;background:var(--sea);color:#fff;border-radius:999px;padding:5px 14px 5px 5px;font-family:var(--display);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--sea-d),0 10px 22px -8px rgba(26,140,203,.7)}
.hearagain .ha-bud{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}

<script>
"use strict";
/* =====================================================================
   CHORE BUDDIES — prototype of the core loop
   task -> nudge -> "Done!" -> parent approves + rates -> coins fly into the world
   ===================================================================== */

// ---------- tiny utils ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
const dayKey = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const DOW = new Date().getDay();
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtTime(hm){ const [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + ap; }
function dueTs(t){ const [h, m] = t.due.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); }
function ago(ts){ const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; return Math.round(h / 24) + ' d ago'; }
function rnd(seed){ let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

// =====================================================================
//  ART ENGINE — soft "vinyl toy" isometric world drawn in SVG
// =====================================================================
const TW = 76, TH = 38, OX = 14 * 76 / 2, OY = 150;
const P = (i, j) => [OX + (i - j) * TW / 2, OY + (i + j) * TH / 2];
const f1 = v => (+v).toFixed(1);
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (a, fill, ex = '') => `<polygon points="${pts(a)}" fill="${fill}" ${ex}/>`;
const up = (p, h) => [p[0], p[1] - h];
const dn = (p, h) => [p[0], p[1] + h];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const line = (p, q, c, w, ex = '') => `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
const diamond = (x, y, s = 1) => [[x, y - TH / 2 * s], [x + TW / 2 * s, y], [x, y + TH / 2 * s], [x - TW / 2 * s, y]];
function starPath(cx, cy, R, r, n = 5){ let d = ''; for (let k = 0; k < n * 2; k++){ const rad = k % 2 ? r : R; const a = -Math.PI / 2 + k * Math.PI / n; d += (k ? 'L' : 'M') + f1(cx + Math.cos(a) * rad) + ',' + f1(cy + Math.sin(a) * rad); } return d + 'Z'; }
const OUT_L = [-0.89, 0.45], OUT_R = [0.89, 0.45];   // outward normals (screen space) of the two visible walls

function box(x, y, s, h, col, o = {}){
  const a = s * TW / 2, b = s * TH / 2;
  const Nn = [x, y - b], E = [x + a, y], S = [x, y + b], W = [x - a, y];
  const Nt = up(Nn, h), Et = up(E, h), St = up(S, h), Wt = up(W, h);
  let g = '';
  g += poly([W, S, St, Wt], shade(col, -.13)) + poly([W, S, St, Wt], 'url(#fsL)');
  g += poly([S, E, Et, St], col) + poly([S, E, Et, St], 'url(#fsR)');
  if (!o.noTop) g += poly([Nt, Et, St, Wt], shade(col, .2));
  g += line(S, St, shade(col, .35), .8, 'opacity=".6"');
  return { g, W, S, E, N: Nn, Wt, St, Et, Nt, h, col };
}
function quadOn(A, B, h, u0, u1, v0, v1, out = [0, 0], d = 0){
  const p = (u, v, dd) => { const q = mix(A, B, u); return [q[0] + out[0] * dd, q[1] - v * h + out[1] * dd]; };
  return [p(u0, v0, d), p(u1, v0, d), p(u1, v1, d), p(u0, v1, d)];
}
function windowOn(A, B, h, u0, u1, v0, v1, o = {}){
  const fr = o.frame || '#FFFFFF';
  let s = poly(quadOn(A, B, h, u0 - .03, u1 + .03, v0 - .05, v1 + .05), fr);
  s += poly(quadOn(A, B, h, u0, u1, v0, v1), o.lit ? 'url(#glassLit)' : 'url(#glass)');
  const q = quadOn(A, B, h, u0, u1, v0, v1);
  s += poly([q[3], mix(q[3], q[2], .35), mix(q[0], q[1], .1)], '#fff', 'opacity=".35"');
  const um = (u0 + u1) / 2, vm = (v0 + v1) / 2;
  const a = quadOn(A, B, h, um, um, v0, v1); s += line(a[0], a[3], fr, 1.3);
  const b = quadOn(A, B, h, u0, u1, vm, vm); s += line(b[0], b[1], fr, 1.3);
  s += poly(quadOn(A, B, h, u0 - .06, u1 + .06, v0 - .09, v0 - .04), shade(fr, -.18));
  if (o.flowers){ const cols = ['#FF5A8C', '#FFC63A', '#FF8FB8', '#B8E986'];
    for (let k = 0; k < 4; k++){ const pp = quadOn(A, B, h, u0 + (u1 - u0) * (k + .5) / 4, 0, v0 - .06, 0)[0]; s += `<circle cx="${f1(pp[0])}" cy="${f1(pp[1] - 2)}" r="2.3" fill="${cols[k]}"/>`; } }
  return s;
}
function doorOn(A, B, h, u0, u1, v1, col){
  let s = poly(quadOn(A, B, h, u0 - .035, u1 + .035, 0, v1 + .06), shade(col, -.35));
  s += poly(quadOn(A, B, h, u0, u1, 0, v1), col) + poly(quadOn(A, B, h, u0, u1, 0, v1), 'url(#fsR)');
  const k = quadOn(A, B, h, u1 - .07, 0, v1 * .45, 0)[0];
  s += `<circle cx="${f1(k[0])}" cy="${f1(k[1])}" r="1.7" fill="#FFD25A"/>`;
  return s;
}
function awningOn(A, B, h, u0, u1, v, c1, c2, out, n = 6, drop = 8){
  let s = '';
  for (let k = 0; k < n; k++){
    const ua = u0 + (u1 - u0) * k / n, ub = u0 + (u1 - u0) * (k + 1) / n;
    const t0 = quadOn(A, B, h, ua, ub, v + .16, v + .16);
    const b0 = quadOn(A, B, h, ua, ub, v, v, out, drop);
    s += poly([t0[0], t0[1], b0[1], b0[0]], k % 2 ? c2 : c1);
    const mid = mix(b0[0], b0[1], .5);
    s += `<ellipse cx="${f1(mid[0])}" cy="${f1(mid[1])}" rx="${f1(Math.hypot(b0[1][0] - b0[0][0], b0[1][1] - b0[0][1]) / 2)}" ry="2.6" fill="${k % 2 ? c2 : c1}"/>`;
  }
  const t = quadOn(A, B, h, u0, u1, v + .16, v + .16), b = quadOn(A, B, h, u0, u1, v, v, out, drop);
  s += poly([t[0], t[1], b[1], b[0]], 'url(#roofR)');
  return s;
}
function gable(b, rh, roof, over = 1.13){
  const c = mix(b.Nt, b.St, .5);
  const ex = p => [c[0] + (p[0] - c[0]) * over, c[1] + (p[1] - c[1]) * over];
  const Nt = ex(b.Nt), Et = ex(b.Et), St = ex(b.St), Wt = ex(b.Wt);
  const R1 = up(mix(Wt, Nt, .5), rh), R2 = up(mix(St, Et, .5), rh);
  const gR = up(mix(b.St, b.Et, .5), rh * .9);
  let g = poly([Nt, Et, R2, R1], shade(roof, -.3));
  g += poly([b.St, b.Et, gR], b.col) + poly([b.St, b.Et, gR], 'url(#fsR)');
  g += poly([St, R2, dn(R2, 3.5), dn(St, 3.5)], shade(roof, -.38));
  g += poly([R2, Et, dn(Et, 3.5), dn(R2, 3.5)], shade(roof, -.3));
  g += poly([Wt, St, R2, R1], roof) + poly([Wt, St, R2, R1], 'url(#roofL)');
  g += poly([Wt, St, dn(St, 4), dn(Wt, 4)], shade(roof, -.32));
  // tile rows
  for (let k = 1; k < 4; k++){ const t = k / 4; g += line(mix(Wt, R1, t), mix(St, R2, t), shade(roof, -.12), 1, 'opacity=".55"'); }
  g += line(R1, R2, shade(roof, .35), 2.2);
  return { g, R1, R2, gR, Wt, St };
}
function hip(b, rh, roof, over = 1.15){
  const c = mix(b.Nt, b.St, .5);
  const ex = p => [c[0] + (p[0] - c[0]) * over, c[1] + (p[1] - c[1]) * over];
  const Nt = ex(b.Nt), Et = ex(b.Et), St = ex(b.St), Wt = ex(b.Wt), A = up(c, rh);
  let g = poly([Wt, Nt, A], shade(roof, -.25)) + poly([Nt, Et, A], shade(roof, -.15));
  g += poly([Wt, St, dn(St, 4), dn(Wt, 4)], shade(roof, -.35)) + poly([St, Et, dn(Et, 4), dn(St, 4)], shade(roof, -.28));
  g += poly([Wt, St, A], shade(roof, -.1)) + poly([Wt, St, A], 'url(#roofL)');
  g += poly([St, Et, A], roof) + poly([St, Et, A], 'url(#roofR)');
  g += line(St, A, shade(roof, .35), 1.6);
  return { g, A };
}
function flatTop(b, rim){
  const c = mix(b.Nt, b.St, .5), sc = p => [c[0] + (p[0] - c[0]) * .8, c[1] + (p[1] - c[1]) * .8];
  return poly([b.Nt, b.Et, b.St, b.Wt], rim) + poly([sc(b.Nt), sc(b.Et), sc(b.St), sc(b.Wt)], shade(rim, -.14));
}
const sph = (cx, cy, r, col, ex = '') => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="${col}" ${ex}/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="url(#sph)"/>`;
const shadowD = (x, y, s = .9) => poly(diamond(x + 7, y + 3, s * 1.06), '#1F4D18', 'opacity=".22" filter="url(#blur3)"');
function signRound(x, y, col, icon){
  return `<g transform="translate(${f1(x)},${f1(y)})">${line([0, 0], [0, 14], '#6B5A7A', 2.2)}<circle r="11.5" fill="${shade(col, -.25)}" cy="1.2"/><circle r="11" fill="#fff"/><circle r="9" fill="${col}"/><circle r="9" fill="url(#sph)"/>${icon}</g>`;
}
const ICON_FORK = `<path d="M-4,-5v4.5M-2.5,-5v4.5M-5.5,-5v4.5M-4,-0.5v6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5,-5.5c2,0 2,4 0,5v6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
const ICON_HANGER = `<path d="M0,-5a2,2 0 1 1 2,2l-2,1.5L-6,3h12L0,-1.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
const ICON_BOOK = `<path d="M-6,-4q3,-1.5 6,0q3,-1.5 6,0v8q-3,-1.5 -6,0q-3,-1.5 -6,0Z" fill="#fff"/><path d="M0,-4v8" stroke="#7aa" stroke-width=".8"/>`;

const R = {};
R.home = (x, y) => {
  const wall = '#FFF0D2', h = 40, b = box(x, y, .72, h, wall, { noTop: 1 });
  let g = shadowD(x, y, .78) + b.g;
  g += poly(quadOn(b.W, b.S, h, 0, 1, 0, .12), '#D7BE98') + poly(quadOn(b.S, b.E, h, 0, 1, 0, .12), '#E5D0AC');
  g += windowOn(b.W, b.S, h, .12, .42, .38, .78, { lit: 1, flowers: 1 });
  g += doorOn(b.W, b.S, h, .58, .84, .66, '#C27A4C');
  g += windowOn(b.S, b.E, h, .3, .7, .36, .74, { lit: 1 });
  const r = gable(b, 30, '#FF7466');
  g += r.g;
  const gc = mix(mix(b.St, b.Et, .5), r.gR, .45);
  g += `<circle cx="${f1(gc[0])}" cy="${f1(gc[1])}" r="4.6" fill="#fff"/><circle cx="${f1(gc[0])}" cy="${f1(gc[1])}" r="3.4" fill="url(#glassLit)"/>`;
  const cb = mix(mix(r.Wt, r.St, .28), mix(r.R1, r.R2, .28), .5);
  const ch = box(cb[0], cb[1] + 3, .13, 17, '#B9675A');
  g += ch.g + `<g fill="#fff">${[1, 2, 3].map(k => `<circle class="smoke s${k}" cx="${f1(cb[0])}" cy="${f1(cb[1] - 18)}" r="4.5"/>`).join('')}</g>`;
  return g;
};
R.restaurant = (x, y) => {
  const wall = '#FFF5E8', h = 50, b = box(x, y, .84, h, wall);
  let g = shadowD(x, y, .9) + b.g;
  g += poly(quadOn(b.W, b.S, h, 0, 1, 0, .3), '#D9604C') + poly(quadOn(b.W, b.S, h, 0, 1, 0, .3), 'url(#brick)');
  g += poly(quadOn(b.S, b.E, h, 0, 1, 0, .3), '#E77560') + poly(quadOn(b.S, b.E, h, 0, 1, 0, .3), 'url(#brick)');
  g += windowOn(b.W, b.S, h, .1, .62, .34, .7, { lit: 1, frame: '#3D3352' });
  g += doorOn(b.S, b.E, h, .38, .64, .6, '#3D3352');
  g += windowOn(b.S, b.E, h, .74, .92, .38, .66, { lit: 1, frame: '#3D3352' });
  g += awningOn(b.W, b.S, h, .04, .7, .72, '#E8414F', '#FFFFFF', OUT_L, 6, 9);
  g += awningOn(b.S, b.E, h, .3, .72, .66, '#E8414F', '#FFFFFF', OUT_R, 4, 8);

async function hashPw(pw, salt){
  try {
    const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 7; for (const ch of salt + '|' + pw) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'f' + h; }
}

function render(){

  tabs.hidden = false;

  $('#who').innerHTML = `<button class="profile" data-act="switchProfile" aria-label="Switch profile">${kidMode ? `<span class="avatar mini">${headBox(kid.char)}</span>` : parentAv(30)}<span>Switch</span></button>`;

      <div class="wallet" id="wallet" aria-label="${kid.coins} coins">${COIN(28)}<span id="walletN">${kid.coins}</span></div></div>` : '';
  const views = kidMode ? { home: vHome, explore: vExplore, build: vBuild, market: vMarket, buddies: vBuddies } : { inbox: vInbox, tasks: vTasks, chat: vChat, family: vFamily, controls: vControls };
  const cur = kidMode ? S.tab : S.ptab;
  v.innerHTML = (views[cur] || (kidMode ? vHome : vInbox))();
  const pending = S.tasks.filter(t => t.status === 'waiting').length + S.requests.length;
  const unreadKids = S.msgs.filter(m => m.from === 'kid' && !m.read).length;
  tabs.innerHTML = (kidMode ? KTABS : PTABS).map(([k, l, c]) => {
    const badge = kidMode ? 0 : k === 'inbox' ? pending : k === 'chat' ? unreadKids : 0;

  sim.attach();
  const th = $('#thread'); if (th) th.scrollTop = th.scrollHeight;
  if (kidMode) afterKidRender();
  save();
}

function vHome(){
  const kid = K(), list = todays(kid.id);
  const waiting = list.find(t => t.status === 'waiting') || list.find(t => isDoing(t));
  const doneN = list.filter(t => t.status === 'approved').length;
  const tired = kid.strength < 25;
  const hud = `<div class="hud tl" title="Energy">${STR_ICON}<div class="meter"><i style="width:${kid.strength}%"></i></div>${kid.strength}%</div>
    <div class="hud tr">${FLAME}${kid.streak} day streak</div>
    ${waiting ? `<div class="workbar"><span class="dot"></span><span>${esc(kid.name)} is ${ACT[waiting.act].verb} at ${ACT[waiting.act].place} ${waiting.status === 'waiting' ? `while ${esc(pname())} checks “${esc(waiting.title)}”` : `while you do “${esc(waiting.title)}” for real`} · <b id="workCount">${workCount(waiting)} ${WORKN[waiting.act] || 'jobs done'}!</b></span>${waiting.status === 'waiting' ? `<button class="btn small sun" data-act="wait" data-id="${waiting.id}">Play</button>` : `<button class="btn small sun" data-act="choreStart" data-id="${waiting.id}">Watch</button>`}</div>`
      : tired ? `<div class="workbar tired"><span class="dot"></span><span>${esc(kid.name)} is too tired to travel or work. Finish a quest to recharge!</span></div>` : ''}`;
  const next = list.filter(t => t.status === 'todo').sort((a, b) => a.due.localeCompare(b.due))[0];
  const B = BUDDIES[kid.buddy];
  const unread = unreadFor(kid.id, 'parent');
  const line = unread ? `${esc(pname())} sent you ${unread > 1 ? unread + ' messages' : 'a message'}! <button class="btn small berry" data-act="openChat">Read</button>`
    : waiting ? `I told ${esc(pname())} about <b>${esc(waiting.title.toLowerCase())}</b>. Fingers crossed!`
    : next ? (overdue(next) ? `Uh oh, <b>${esc(next.title.toLowerCase())}</b> is late. Let's do it now!` : `Next up: <b>${esc(next.title.toLowerCase())}</b> by ${fmtTime(next.due)}. ${ACT[next.act].place} needs you!`)
    : `Every quest is done today! Let's go explore and meet the robots.`;
  return `${worldBlock(kid, { hud })}
  ${eventCard(kid)}
  ${giftCard(kid)}
  <div class="talk"><button class="bud" data-act="petBuddy" aria-label="Pet ${B.name}">${budBox(kid.buddy, { cheer: !next })}</button><p class="say"><small>${B.name} says</small>${line}</p></div>
  <div class="sec-h"><h2>Today's quests</h2><small>${doneN} of ${list.length} done</small></div>
  <div class="quests">${list.length ? list.sort(qsort).map(questCard).join('') : `<div class="card empty">${budBox(kid.buddy)}<h3>No quests today</h3><p>Ask ${esc(pname())} to add one.</p></div>`}</div>
  ${placesCard(kid)}
  ${robotsCard(kid)}`;
}
const qorder = { todo: 0, waiting: 1, approved: 2, missed: 3 };
const qsort = (a, b) => (qorder[a.status] - qorder[b.status]) || a.due.localeCompare(b.due);
function questCard(t){
  const late = overdue(t);
  let right = '';
  if (t.status === 'todo') right = `<button class="btn" data-act="done" data-id="${t.id}">Done!</button>`;
  else if (t.status === 'waiting') right = `<span class="pill wait">Sent to ${esc(pname())}</span>`;
  else if (t.status === 'approved') right = `<span class="pill ok">+${t.paid ?? t.coins}</span>`;
  else right = `<span class="pill miss">Missed</span>`;
  return `<div class="quest ${t.status === 'approved' ? 'done' : ''}">${icon(t.icon)}<div class="qbody"><h3>${esc(t.title)}</h3><div class="qmeta"><span class="coinchip">${COIN()}${t.coins}</span><span class="${late ? 'late' : ''}">${late ? 'Late! ' : 'by '}${fmtTime(t.due)}</span>${t.status === 'approved' && t.stars ? `<span class="stars">${'★'.repeat(t.stars)}</span>` : `<span>· ${ACT[t.act].name}</span>`}</div></div>${right}</div>`;
}

function vMarket(){
  const kid = K();

  const reqIds = S.requests.filter(r => r.kid === kid.id).map(r => r.item);
  return `<div class="sec-h"><h2>Market</h2><small>You have ${kid.coins} coins</small></div>
  <div class="chips" role="group" aria-label="Market sections">${cats.map(c => `<button class="chip" data-act="cat" data-v="${c}" aria-pressed="${ui.cat === c}">${c}${c === 'Holiday' ? ' ❄' : ''}</button>`).join('')}</div>
  <div class="grid">${items.map(it => {
    const own = it.kind === 'place' ? (!it.multi && owns(kid, it.t)) : it.kind === 'outfit' ? kid.outfits.includes(it.v) : it.kind === 'buddy' ? kid.buddies.includes(it.v) : false;
    const asked = reqIds.includes(it.id);
    const thumb = it.kind === 'place' ? thumbBox(it.t) : it.kind === 'outfit' ? outfitBox(kid, it.v) : budBox(it.v);

function applyCam(){

}
const sim = {
  kid: null, fi: 9, fj: 6, path: [], face: 1, bi: 9.4, bj: 6.4, last: 0, nextWander: 0, key: '', working: false, manual: null, holdUntil: 0, robot: null, block: new Set(),

    const layer = svg.querySelector('#objLayer'), NS = 'http://www.w3.org/2000/svg';
    this.charG = document.createElementNS(NS, 'g'); this.budG = document.createElementNS(NS, 'g'); this.bubG = document.createElementNS(NS, 'g');
    [this.charG, this.budG, this.bubG].forEach(g => g.style.pointerEvents = 'none');

    this.key = ''; this.placeAll(); this.paint(true); applyCam();
    let drag = null;
    svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.cx, cy: cam.cy, moved: false, id: e.pointerId }; });
    svg.addEventListener('pointermove', e => {
      if (!drag) return;

      if (!drag.moved && Math.hypot(dx, dy) > 7){ drag.moved = true; try { svg.setPointerCapture(drag.id); } catch (er) {} }

  },
  walk(i, j){ const t = TER(i, j); return t && t !== '~' && !this.block.has(i + ',' + j); },
  bfs(from, to){

    while (q.length){ const [i, j] = q.shift(); if (i === to[0] && j === to[1]){ found = true; break; }
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const a = i + di, b = j + dj; if (!this.walk(a, b) || k(a, b) in prev) continue; prev[k(a, b)] = [i, j]; q.push([a, b]); } }

  arrive(){ this.manual = null; this.holdUntil = performance.now() + 9000; const h = $('#travelHud'); if (h) h.hidden = true; if (this.robot){ const id = this.robot; this.robot = null; openRobot(id); } if (this.enter){ const ob = K().world.find(o => o.id === this.enter); this.enter = null; if (ob) openRoom(ob); } },
  workTile(act){ const b = K().world.find(o => o.t === ACT[act].b); if (!b) return null; const spots = workSpots(act); if (spots.length) return spots[0]; const n = this.near(b.i, b.j); return n ? n.t : null; },

function readPhoto(file, cb){

document.addEventListener('submit', async e => {
