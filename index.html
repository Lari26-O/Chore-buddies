<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#E9F6FF">
<title>Chore Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a phone-shaped app column. The floating-island world is the hero; quests stack under it; chunky candy tabs at the bottom.
   Single bright daytime look by design (a kids' toy world), so colors are set explicitly for every host theme. */
:root{
  --page:#D7EEFF; --app:#F2F9FF;
  --ink:#2B2550; --ink-2:#5F5A86; --ink-3:#9A95BC;
  --card:#FFFFFF; --card-2:#F4F7FF; --line:#E2E8F7;
  --sun:#FFC63A; --sun-d:#E39A00;
  --berry:#FF5A8C; --berry-d:#D33A6B;
  --leaf:#3EC46B; --leaf-d:#23994C;
  --grape:#7B5CFA; --grape-d:#5A3FD6;
  --sea:#34B2F0; --sea-d:#1A8CCB;
  --danger:#EF4E4B; --danger-d:#C23230;
  --display:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--page) radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px) 0 0/46px 46px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--grape);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#E9F6FF 0%,var(--app) 40%,#FFF8EE 100%);overflow:hidden}
@media (min-width:560px){#app{box-shadow:0 0 0 1px #c9e2f7,0 30px 80px -20px rgba(43,37,80,.35)}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.02em;margin-right:auto}
.brand svg{width:28px;height:28px}
.brand span b{color:var(--berry)}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button.parent[aria-pressed="true"]{background:var(--grape)}

.kidstrip{display:flex;align-items:center;gap:10px;padding-block:4px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.avatar{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#CFEAFF);box-shadow:0 3px 0 #a9d3f2,inset 0 0 0 3px #fff;overflow:hidden;flex:none}
.avatar svg{width:100%;height:100%}
.kidname{min-width:0;flex:1;text-align:left}
.kidname h1{font-size:21px}
.kidname small{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.wallet{display:flex;align-items:center;gap:6px;background:#fff;padding:5px 12px 5px 6px;border-radius:999px;box-shadow:0 3px 0 #F1C46B,inset 0 0 0 2px #FFE7A6;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.wallet svg{width:28px;height:28px}
.wallet.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}

main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:2px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}

/* ---------- tabs ---------- */
nav#tabs{display:flex;justify-content:space-around;background:#fff;border-top:1.5px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:11.5px;color:var(--ink-3);padding:4px 0;border-radius:16px;position:relative}
nav#tabs button svg{width:26px;height:26px}
nav#tabs button[aria-current="page"]{color:var(--ink)}
nav#tabs button[aria-current="page"] .ti{background:var(--tc,#FFE38A);transform:translateY(-2px)}
.ti{display:grid;place-items:center;width:46px;height:32px;border-radius:12px;transition:transform .15s}
.badge{position:absolute;top:0;right:calc(50% - 26px);background:var(--berry);color:#fff;font-size:11px;font-weight:900;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #fff}

/* ---------- buttons ---------- */
.btn{--b:var(--leaf);--bd:var(--leaf-d);display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--b);color:#fff;font-family:var(--display);font-weight:800;font-size:16px;padding:9px 16px 8px;border-radius:16px;box-shadow:0 4px 0 var(--bd),0 8px 14px -6px rgba(43,37,80,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{--b:#D9DEEC;--bd:#BCC3D8;color:#fff;cursor:not-allowed}
.btn.sun{--b:var(--sun);--bd:var(--sun-d);color:#5a3a00}
.btn.berry{--b:var(--berry);--bd:var(--berry-d)}
.btn.grape{--b:var(--grape);--bd:var(--grape-d)}
.btn.sea{--b:var(--sea);--bd:var(--sea-d)}
.btn.red{--b:var(--danger);--bd:var(--danger-d)}
.btn.ghost{--b:#fff;--bd:#D5DCEE;color:var(--ink)}
.btn.small{font-size:14px;padding:6px 12px 5px;border-radius:13px}
.btn.big{font-size:19px;padding:13px 20px 12px;border-radius:20px;width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.coinchip{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;color:#8A5A00;background:#FFF2C4;border-radius:999px;padding:1px 9px 0 3px;font-size:15px;font-variant-numeric:tabular-nums}
.coinchip svg{width:18px;height:18px}

/* ---------- world ---------- */
.world-wrap{position:relative;width:100%;aspect-ratio:476/452;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#6FC4FF 0%,#A9DDFF 45%,#DDF3FF 80%,#F3FBFF 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 14px 30px -14px rgba(30,80,140,.45);flex:none;max-width:100%}
.world-wrap > svg.world{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.sun{position:absolute;top:5%;right:7%;width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFFBE0,#FFE36B 55%,#FFC93A);box-shadow:0 0 0 10px rgba(255,236,140,.35),0 0 60px 20px rgba(255,230,120,.55);z-index:0}
.rainbow{position:absolute;left:-10%;top:20%;width:70%;z-index:0;opacity:.55}
.cloud{position:absolute;z-index:1;animation:drift linear infinite;filter:drop-shadow(0 6px 6px rgba(80,140,200,.18))}
.cloud.front{z-index:3;opacity:.92}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.hud{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:999px;padding:5px 10px 5px 6px;font-weight:900;font-size:12.5px;box-shadow:0 3px 10px -3px rgba(43,37,80,.25)}
.hud.tl{top:10px;left:10px}.hud.tr{top:10px;right:10px}
.hud svg{width:20px;height:20px;flex:none}
.meter{width:62px;height:9px;border-radius:9px;background:#E7EAF6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FF8A3D,#FFC63A 50%,#3EC46B)}
.workbar{position:absolute;z-index:4;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(43,37,80,.82);color:#fff;border-radius:16px;padding:8px 12px;font-weight:800;font-size:13px;backdrop-filter:blur(6px)}
.workbar .dot{width:9px;height:9px;border-radius:50%;background:#7CFFB0;box-shadow:0 0 0 0 #7CFFB0;animation:ping 1.4s infinite;flex:none}
.workbar.tired .dot{background:#FFB36B;animation:none}
.workbar span{flex:1;min-width:0}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,255,176,.8)}100%{box-shadow:0 0 0 10px rgba(124,255,176,0)}}
.bob{animation:bob .42s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.workwiggle{animation:wiggle .7s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.smoke{animation:smoke 3.2s ease-out infinite;opacity:0}
.smoke.s2{animation-delay:1.1s}.smoke.s3{animation-delay:2.2s}
@keyframes smoke{0%{opacity:.0;transform:translate(0,0) scale(.6)}20%{opacity:.75}100%{opacity:0;transform:translate(8px,-34px) scale(1.6)}}
.spray{stroke-dasharray:3 5;animation:spray .6s linear infinite}
@keyframes spray{to{stroke-dashoffset:-16}}
.fall{stroke-dasharray:10 8;animation:fallw .7s linear infinite}
@keyframes fallw{to{stroke-dashoffset:-36}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d2{animation-delay:.5s}.twinkle.d3{animation-delay:1s}
@keyframes twinkle{50%{transform:scale(.4);opacity:.3}}
.rise{animation:rise 2.4s ease-in infinite;transform-box:fill-box}
.rise.d2{animation-delay:.8s}.rise.d3{animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.spin{animation:spinr 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinr{to{transform:rotate(360deg)}}
.bubble-pop{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.hit{fill:transparent;cursor:pointer}
.building .hit.free{fill:rgba(255,255,255,.22);stroke:#fff;stroke-width:1.6;stroke-dasharray:5 4}
.building .hit.free:hover{fill:rgba(255,255,255,.5)}
.building .hit.used:hover{fill:rgba(255,90,140,.18);stroke:#FF5A8C;stroke-width:2}
.building .hit.path{cursor:not-allowed}
.building.armed .hit.free{fill:rgba(255,230,120,.38);stroke:#FFC63A;animation:armed 1s ease-in-out infinite}
@keyframes armed{50%{fill:rgba(255,230,120,.12)}}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 2px 0 var(--line),0 10px 24px -16px rgba(43,37,80,.3)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:-4px}
.sec-h h2{font-size:23px}
.sec-h small{font-weight:800;color:var(--ink-3);font-size:13px}
.talk{display:flex;align-items:center;gap:10px}
.talk .bud{width:74px;height:74px;flex:none}
.talk .say{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--line),0 8px 18px -12px rgba(43,37,80,.35);min-width:0}
.talk .say:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.talk .say b{color:var(--berry)}
.talk .say small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}

.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:11px 12px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px rgba(43,37,80,.35)}
.qicon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.qicon svg{width:34px;height:34px}
.qbody{flex:1;min-width:0}
.qbody h3{font-size:17.5px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;font-weight:800;color:var(--ink-3);margin-top:2px}
.qmeta .late{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.wait{background:#FFF1C9;color:#93610A}
.pill.ok{background:#DDF8E6;color:#1D7A3E}
.pill.miss{background:#FFE1E1;color:#B42B2B}
.pill.req{background:#ECE6FF;color:#5A3FD6}
.quest.done{opacity:.8}
.quest.done h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#9fe0b5}
.stars{color:#FFB800;letter-spacing:1px;font-size:13px}
.ring{width:44px;height:44px;flex:none}

.learn{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#FFF6D8,#FFE9F1);}
.learn .tag{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#C0567B}
.learn h3{font-size:18px}
.answers{display:flex;flex-direction:column;gap:7px}
.answers button{background:#fff;border-radius:14px;padding:9px 12px;text-align:left;font-weight:800;box-shadow:0 3px 0 #EBD9C4}
.answers button.right{background:#DDF8E6;box-shadow:0 3px 0 #9fe0b5}
.answers button.wrong{background:#FFE1E1;box-shadow:0 3px 0 #f3b3b3}

/* ---------- market / grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:#fff;border-radius:22px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px rgba(43,37,80,.35);position:relative}
.thumb{border-radius:16px;aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#fff,#DFF2FF);overflow:hidden}
.thumb svg{width:100%;height:100%}
.item h4{font-size:15.5px}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.item .tagx{position:absolute;top:14px;left:14px;max-width:calc(100% - 28px);font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;background:#E7F7FF;color:#1A8CCB;text-transform:uppercase;letter-spacing:.06em}
.item .tagx.hol{background:#FFE4E4;color:#D2363B}
.item .tagx.own{background:#DDF8E6;color:#1D7A3E}
.tray{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.tray button{flex:none;width:92px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 3px 0 var(--line);scroll-snap-align:start;font-weight:800;font-size:12px}
.tray button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun),0 3px 0 var(--sun-d)}
.tray .thumb{aspect-ratio:1}

/* ---------- me & buddies ---------- */
.me{display:flex;gap:12px;align-items:center}
.me .stage{width:44%;flex:none;aspect-ratio:3/4;border-radius:22px;background:radial-gradient(ellipse 60% 14% at 50% 90%,#A9DE8F 0 70%,transparent 72%),linear-gradient(180deg,#BFE6FF,#EAF7FF 75%,#D9F2C8);display:grid;place-items:center}
.me .stage svg{width:100%;height:100%}
.opts{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.opts label{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 2px #fff}
.sw[aria-pressed="true"]{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 2px #fff,0 0 0 4.5px var(--ink)}
.buddycard .thumb{background:radial-gradient(circle at 50% 35%,#fff,#FFEAF2)}
.buddycard.active{box-shadow:0 0 0 3px var(--berry),0 3px 0 var(--berry-d)}
.lvl{font-size:12px;font-weight:900;color:var(--grape)}
.buddycard p{font-size:12.5px;color:var(--ink-2);font-weight:600}
.locked svg{filter:grayscale(1) brightness(.4) opacity(.35)}

/* ---------- parent ---------- */
.p-hero{background:linear-gradient(135deg,#7B5CFA,#9C7BFF 60%,#C08CFF);color:#fff;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 24px -14px rgba(90,63,214,.7)}
.p-hero h2{font-size:24px}
.p-hero p{font-weight:700;opacity:.9;font-size:14px}
.inbox{display:flex;flex-direction:column;gap:12px}
.appr{display:flex;flex-direction:column;gap:10px}
.appr-top{display:flex;gap:10px;align-items:center}
.appr-top .avatar{width:42px;height:42px}
.appr-top h3{font-size:18px}
.appr-top small{font-weight:800;color:var(--ink-3);font-size:12.5px}
.note{background:var(--card-2);border-radius:14px;padding:9px 12px;font-weight:700;font-size:14px}
.note b{font-family:var(--display)}
.proof{display:flex;gap:8px}
.proof figure{margin:0;flex:1;min-width:0}
.proof img,.proof .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--card-2);display:grid;place-items:center;color:var(--ink-3);font-weight:800;font-size:12px;text-align:center}
.proof figcaption{font-size:11.5px;font-weight:800;color:var(--ink-3);margin-top:3px}
.starpick{display:flex;gap:2px}
.starpick button{font-size:30px;line-height:1;color:#DDE2EF;padding:0 2px;transition:transform .1s}
.starpick button.on{color:#FFB800;text-shadow:0 2px 0 #E39A00}
.starpick button:active{transform:scale(1.25)}
.breakdown{display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-weight:700;color:var(--ink-2);background:#FFFBEA;border-radius:14px;padding:9px 12px;font-variant-numeric:tabular-nums}
.breakdown div{display:flex;justify-content:space-between;gap:8px}
.breakdown .tot{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);border-top:1.5px dashed #F0DA9A;padding-top:4px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 10px;box-shadow:0 2px 0 var(--line)}
.trow .qicon{width:42px;height:42px;border-radius:14px}
.trow .qicon svg{width:28px;height:28px}
.trow h4{font-size:15.5px}
.trow .qmeta{font-size:12px}
.warnbox{border-radius:20px;padding:12px;background:#FFF0EE;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1.5px #FFD3CE}
.warnbox h3{font-size:17px;color:#B42B2B}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card-2);border-radius:16px;padding:9px 10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-weight:800;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.week div{background:var(--card-2);border-radius:12px;padding:6px 0;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.week div.has{background:#DDF8E6;color:#1D7A3E}
.week div.today{box-shadow:inset 0 0 0 2px var(--leaf)}
.week small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:800}
.hist{display:flex;flex-direction:column;gap:2px;font-size:13.5px;font-weight:700}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border:0}
.hist .plus{color:var(--leaf-d);font-variant-numeric:tabular-nums}

<script>
"use strict";
/* =====================================================================
   CHORE BUDDIES — prototype of the core loop
   task -> nudge -> "Done!" -> parent approves + rates -> coins fly into the world
   ===================================================================== */

// ---------- tiny utils ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
const dayKey = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const DOW = new Date().getDay();
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtTime(hm){ const [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + ap; }
function dueTs(t){ const [h, m] = t.due.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); }
function ago(ts){ const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; return Math.round(h / 24) + ' d ago'; }
function rnd(seed){ let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

// =====================================================================
//  ART ENGINE — soft "vinyl toy" isometric world drawn in SVG
// =====================================================================
const TW = 76, TH = 38, N = 6, OX = 228, OY = 132;
const P = (i, j) => [OX + (i - j) * TW / 2, OY + (i + j) * TH / 2];
const f1 = v => (+v).toFixed(1);
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (a, fill, ex = '') => `<polygon points="${pts(a)}" fill="${fill}" ${ex}/>`;
const up = (p, h) => [p[0], p[1] - h];
const dn = (p, h) => [p[0], p[1] + h];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const line = (p, q, c, w, ex = '') => `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
const diamond = (x, y, s = 1) => [[x, y - TH / 2 * s], [x + TW / 2 * s, y], [x, y + TH / 2 * s], [x - TW / 2 * s, y]];
function starPath(cx, cy, R, r, n = 5){ let d = ''; for (let k = 0; k < n * 2; k++){ const rad = k % 2 ? r : R; const a = -Math.PI / 2 + k * Math.PI / n; d += (k ? 'L' : 'M') + f1(cx + Math.cos(a) * rad) + ',' + f1(cy + Math.sin(a) * rad); } return d + 'Z'; }
const OUT_L = [-0.89, 0.45], OUT_R = [0.89, 0.45];   // outward normals (screen space) of the two visible walls

function box(x, y, s, h, col, o = {}){
  const a = s * TW / 2, b = s * TH / 2;
  const Nn = [x, y - b], E = [x + a, y], S = [x, y + b], W = [x - a, y];
  const Nt = up(Nn, h), Et = up(E, h), St = up(S, h), Wt = up(W, h);
  let g = '';
  g += poly([W, S, St, Wt], shade(col, -.13)) + poly([W, S, St, Wt], 'url(#fsL)');
  g += poly([S, E, Et, St], col) + poly([S, E, Et, St], 'url(#fsR)');
  if (!o.noTop) g += poly([Nt, Et, St, Wt], shade(col, .2));
  g += line(S, St, shade(col, .35), .8, 'opacity=".6"');
  return { g, W, S, E, N: Nn, Wt, St, Et, Nt, h, col };
}
function quadOn(A, B, h, u0, u1, v0, v1, out = [0, 0], d = 0){
  const p = (u, v, dd) => { const q = mix(A, B, u); return [q[0] + out[0] * dd, q[1] - v * h + out[1] * dd]; };
  return [p(u0, v0, d), p(u1, v0, d), p(u1, v1, d), p(u0, v1, d)];
}
function windowOn(A, B, h, u0, u1, v0, v1, o = {}){
  const fr = o.frame || '#FFFFFF';
  let s = poly(quadOn(A, B, h, u0 - .03, u1 + .03, v0 - .05, v1 + .05), fr);
  s += poly(quadOn(A, B, h, u0, u1, v0, v1), o.lit ? 'url(#glassLit)' : 'url(#glass)');
  const q = quadOn(A, B, h, u0, u1, v0, v1);
  s += poly([q[3], mix(q[3], q[2], .35), mix(q[0], q[1], .1)], '#fff', 'opacity=".35"');
  const um = (u0 + u1) / 2, vm = (v0 + v1) / 2;
  const a = quadOn(A, B, h, um, um, v0, v1); s += line(a[0], a[3], fr, 1.3);
  const b = quadOn(A, B, h, u0, u1, vm, vm); s += line(b[0], b[1], fr, 1.3);
  s += poly(quadOn(A, B, h, u0 - .06, u1 + .06, v0 - .09, v0 - .04), shade(fr, -.18));
  if (o.flowers){ const cols = ['#FF5A8C', '#FFC63A', '#FF8FB8', '#B8E986'];
    for (let k = 0; k < 4; k++){ const pp = quadOn(A, B, h, u0 + (u1 - u0) * (k + .5) / 4, 0, v0 - .06, 0)[0]; s += `<circle cx="${f1(pp[0])}" cy="${f1(pp[1] - 2)}" r="2.3" fill="${cols[k]}"/>`; } }
  return s;
}
function doorOn(A, B, h, u0, u1, v1, col){
  let s = poly(quadOn(A, B, h, u0 - .035, u1 + .035, 0, v1 + .06), shade(col, -.35));
  s += poly(quadOn(A, B, h, u0, u1, 0, v1), col) + poly(quadOn(A, B, h, u0, u1, 0, v1), 'url(#fsR)');
  const k = quadOn(A, B, h, u1 - .07, 0, v1 * .45, 0)[0];
  s += `<circle cx="${f1(k[0])}" cy="${f1(k[1])}" r="1.7" fill="#FFD25A"/>`;
  return s;
}
function awningOn(A, B, h, u0, u1, v, c1, c2, out, n = 6, drop = 8){
  let s = '';
  for (let k = 0; k < n; k++){
    const ua = u0 + (u1 - u0) * k / n, ub = u0 + (u1 - u0) * (k + 1) / n;
    const t0 = quadOn(A, B, h, ua, ub, v + .16, v + .16);
    const b0 = quadOn(A, B, h, ua, ub, v, v, out, drop);
    s += poly([t0[0], t0[1], b0[1], b0[0]], k % 2 ? c2 : c1);
    const mid = mix(b0[0], b0[1], .5);
    s += `<ellipse cx="${f1(mid[0])}" cy="${f1(mid[1])}" rx="${f1(Math.hypot(b0[1][0] - b0[0][0], b0[1][1] - b0[0][1]) / 2)}" ry="2.6" fill="${k % 2 ? c2 : c1}"/>`;
  }
  const t = quadOn(A, B, h, u0, u1, v + .16, v + .16), b = quadOn(A, B, h, u0, u1, v, v, out, drop);
  s += poly([t[0], t[1], b[1], b[0]], 'url(#roofR)');
  return s;
}
function gable(b, rh, roof, over = 1.13){
  const c = mix(b.Nt, b.St, .5);
  const ex = p => [c[0] + (p[0] - c[0]) * over, c[1] + (p[1] - c[1]) * over];
  const Nt = ex(b.Nt), Et = ex(b.Et), St = ex(b.St), Wt = ex(b.Wt);
  const R1 = up(mix(Wt, Nt, .5), rh), R2 = up(mix(St, Et, .5), rh);
  const gR = up(mix(b.St, b.Et, .5), rh * .9);
  let g = poly([Nt, Et, R2, R1], shade(roof, -.3));
  g += poly([b.St, b.Et, gR], b.col) + poly([b.St, b.Et, gR], 'url(#fsR)');
  g += poly([St, R2, dn(R2, 3.5), dn(St, 3.5)], shade(roof, -.38));
  g += poly([R2, Et, dn(Et, 3.5), dn(R2, 3.5)], shade(roof, -.3));
  g += poly([Wt, St, R2, R1], roof) + poly([Wt, St, R2, R1], 'url(#roofL)');
  g += poly([Wt, St, dn(St, 4), dn(Wt, 4)], shade(roof, -.32));
  // tile rows
  for (let k = 1; k < 4; k++){ const t = k / 4; g += line(mix(Wt, R1, t), mix(St, R2, t), shade(roof, -.12), 1, 'opacity=".55"'); }
  g += line(R1, R2, shade(roof, .35), 2.2);
  return { g, R1, R2, gR, Wt, St };
}
function hip(b, rh, roof, over = 1.15){
  const c = mix(b.Nt, b.St, .5);
  const ex = p => [c[0] + (p[0] - c[0]) * over, c[1] + (p[1] - c[1]) * over];
  const Nt = ex(b.Nt), Et = ex(b.Et), St = ex(b.St), Wt = ex(b.Wt), A = up(c, rh);
  let g = poly([Wt, Nt, A], shade(roof, -.25)) + poly([Nt, Et, A], shade(roof, -.15));
  g += poly([Wt, St, dn(St, 4), dn(Wt, 4)], shade(roof, -.35)) + poly([St, Et, dn(Et, 4), dn(St, 4)], shade(roof, -.28));
  g += poly([Wt, St, A], shade(roof, -.1)) + poly([Wt, St, A], 'url(#roofL)');
  g += poly([St, Et, A], roof) + poly([St, Et, A], 'url(#roofR)');
  g += line(St, A, shade(roof, .35), 1.6);
  return { g, A };
}
function flatTop(b, rim){
  const c = mix(b.Nt, b.St, .5), sc = p => [c[0] + (p[0] - c[0]) * .8, c[1] + (p[1] - c[1]) * .8];
  return poly([b.Nt, b.Et, b.St, b.Wt], rim) + poly([sc(b.Nt), sc(b.Et), sc(b.St), sc(b.Wt)], shade(rim, -.14));
}
const sph = (cx, cy, r, col, ex = '') => `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="${col}" ${ex}/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="url(#sph)"/>`;
const shadowD = (x, y, s = .9) => poly(diamond(x + 7, y + 3, s * 1.06), '#1F4D18', 'opacity=".22" filter="url(#blur3)"');
function signRound(x, y, col, icon){
  return `<g transform="translate(${f1(x)},${f1(y)})">${line([0, 0], [0, 14], '#6B5A7A', 2.2)}<circle r="11.5" fill="${shade(col, -.25)}" cy="1.2"/><circle r="11" fill="#fff"/><circle r="9" fill="${col}"/><circle r="9" fill="url(#sph)"/>${icon}</g>`;
}
const ICON_FORK = `<path d="M-4,-5v4.5M-2.5,-5v4.5M-5.5,-5v4.5M-4,-0.5v6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5,-5.5c2,0 2,4 0,5v6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
const ICON_HANGER = `<path d="M0,-5a2,2 0 1 1 2,2l-2,1.5L-6,3h12L0,-1.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
const ICON_BOOK = `<path d="M-6,-4q3,-1.5 6,0q3,-1.5 6,0v8q-3,-1.5 -6,0q-3,-1.5 -6,0Z" fill="#fff"/><path d="M0,-4v8" stroke="#7aa" stroke-width=".8"/>`;

const R = {};
R.home = (x, y) => {
  const wall = '#FFF0D2', h = 40, b = box(x, y, .72, h, wall, { noTop: 1 });
  let g = shadowD(x, y, .78) + b.g;
  g += poly(quadOn(b.W, b.S, h, 0, 1, 0, .12), '#D7BE98') + poly(quadOn(b.S, b.E, h, 0, 1, 0, .12), '#E5D0AC');
  g += windowOn(b.W, b.S, h, .12, .42, .38, .78, { lit: 1, flowers: 1 });
  g += doorOn(b.W, b.S, h, .58, .84, .66, '#C27A4C');

const qsort = (a, b) => (qorder[a.status] - qorder[b.status]) || a.due.localeCompare(b.due);
function questCard(t){

function payout(t){
  const kid = kidOf(t.kid), a = ui.appr[t.id] || (ui.appr[t.id] = { stars: 5, bonus: 0 });

  const rest = todays(t.kid).filter(x => x.id !== t.id && x.status !== 'approved').length;
  const streakB = !rest && kid.streakDay !== dayKey() && (kid.streak + 1) % 5 === 0 ? 5 : 0;
  return { a, base: t.coins, early, star, streakB, total: t.coins + early + star + streakB + a.bonus };
}

function vFamily(){

    const wk = Date.now() - 7 * 864e5;

    const days = [...Array(7)].map((_, k) => { const d = new Date(now); d.setDate(now.getDate() - 6 + k); const key = dayKey(d); return { d, sum: h.filter(x => x.kind === 'earn' && dayKey(new Date(x.ts)) === key).reduce((a, x) => a + x.amt, 0), today: k === 6 }; });
    const bought = h.filter(x => x.kind === 'spend').slice(-4).reverse();
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="appr-top"><div class="avatar">${headBox(kid.char)}</div><div style="flex:1;min-width:0"><h3>${esc(kid.name)}, ${kid.age}</h3><small>${BUDDIES[kid.buddy].name} the ${BUDDIES[kid.buddy].kind.toLowerCase()} · energy ${kid.strength}%</small></div><button class="btn small sea" data-act="seeKid" data-v="${id}">Open world</button></div>

// =====================================================================
//  WORLD SIM — character walks the paths, goes to work, buddy follows
// =====================================================================
const sim = {
  kid: null, fi: 3, fj: 2, path: [], goal: null, face: 1, bi: 3.4, bj: 2.4, last: 0, nextWander: 0, key: '', working: false,
  attach(){
    const svg = document.getElementById('worldMain');
    this.svg = svg; if (!svg) return;
    const kid = K();
    if (this.kid !== kid.id){ this.kid = kid.id; this.fi = 3; this.fj = 2; this.path = []; this.goal = null; this.bi = 3.4; this.bj = 2.4; }
    const layer = svg.querySelector('#objLayer');
    this.charG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.budG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.bubG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.charG.style.pointerEvents = this.budG.style.pointerEvents = this.bubG.style.pointerEvents = 'none';
    layer.appendChild(this.budG); layer.appendChild(this.charG); svg.appendChild(this.bubG);
    this.key = ''; this.placeAll(); this.paint(true);
  },
  state(){
    const kid = K();
    const w = S.tasks.find(t => t.kid === kid.id && t.status === 'waiting');
    const tired = kid.strength < 25;
    return { kid, w, tired };
  },
  workTile(act){
    const kid = K(), b = kid.world.find(o => o.t === ACT[act].b);
    if (!b) return [3, 2];
    let best = null, bd = 99;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (isPath(i, j)){ const d = Math.abs(i - b.i) + Math.abs(j - b.j); if (d < bd){ bd = d; best = [i, j]; } }
    return best;
  },
  bfs(from, to){
    const k = (i, j) => i + ',' + j, prev = { [k(...from)]: null }, q = [from];
    while (q.length){ const [i, j] = q.shift(); if (i === to[0] && j === to[1]) break;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([di, dj]) => { const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= N || b >= N || !isPath(a, b) || k(a, b) in prev) return; prev[k(a, b)] = [i, j]; q.push([a, b]); }); }
    const out = []; let c = to; if (!(k(...to) in prev)) return [];
    while (c && !(c[0] === from[0] && c[1] === from[1])){ out.unshift(c); c = prev[k(...c)]; }
    return out;
  },
  tick(ts){
    if (!this.svg || !this.svg.isConnected) return;
    const dt = Math.min(.05, (ts - (this.last || ts)) / 1000); this.last = ts;
    const { w, tired, kid } = this.state();
    const cur = [Math.round(this.fi), Math.round(this.fj)];
    let goal = this.goal;
    if (w){ goal = this.workTile(w.act); }
    else if (tired){ goal = null; this.path = []; }
    else if (!this.path.length && ts > this.nextWander){ const opts = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (isPath(i, j)) opts.push([i, j]); goal = opts[Math.floor(Math.random() * opts.length)]; this.nextWander = ts + 3500 + Math.random() * 4000; }
    if (goal && (!this.goal || goal[0] !== this.goal[0] || goal[1] !== this.goal[1])){ this.goal = goal; this.path = this.bfs(cur, goal); }
    let moving = false;
    if (this.path.length){
      const [ti, tj] = this.path[0], di = ti - this.fi, dj = tj - this.fj, d = Math.hypot(di, dj);
      const sp = (kid.strength < 45 ? .9 : 1.7) * dt;
      if (d <= sp){ this.fi = ti; this.fj = tj; this.path.shift(); } else { this.fi += di / d * sp; this.fj += dj / d * sp; }
      const sx = (di - dj); if (Math.abs(sx) > .01) this.face = sx > 0 ? 1 : -1;
      moving = true;
    }
    // buddy follows a little behind
    const tbi = this.fi + .32 * -this.face, tbj = this.fj + .32;
    this.bi += (tbi - this.bi) * Math.min(1, dt * 3); this.bj += (tbj - this.bj) * Math.min(1, dt * 3);
    const atWork = !!w && !this.path.length;
    this.working = atWork;
    this.moving = moving;
    this.paint();
    this.placeAll();
  },
  paint(force){
    const { w, tired, kid } = this.state();
    const mode = (this.working ? 'w:' + w.act : tired ? 'tired' : 'idle') + (this.moving ? ':m' : '') + JSON.stringify(kid.char) + kid.buddy;
    if (mode !== this.key || force){
      this.key = mode;
      this.charG.innerHTML = `<g class="${this.moving ? 'bob' : this.working ? 'workwiggle' : ''}">${charSVG(kid.char, { work: this.working ? w.act : '', mood: tired ? 'tired' : this.working ? 'cheer' : 'happy' })}</g>`;
      this.budG.innerHTML = `<g class="${this.moving ? 'bob' : ''}">${buddySVG(kid.buddy, { sleepy: tired })}</g>`;
      this.bubG.innerHTML = this.working ? `<g class="bubble-pop"><path d="M-20,-30 h40 a10,10 0 0 1 10,10 v10 a10,10 0 0 1 -10,10 h-14 l-6,7 l-6,-7 h-14 a10,10 0 0 1 -10,-10 v-10 a10,10 0 0 1 10,-10z" fill="#fff" stroke="#E2E8F7"/><g transform="translate(0,-15) scale(.62)"><svg x="-17" y="-17" width="34" height="34" viewBox="0 0 34 34">${ICONS[w.icon]?.svg || ''}</svg></g></g>`
        : tired ? `<text x="8" y="-14" font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="16" fill="#7B5CFA">z<tspan font-size="12" dy="-6">z</tspan><tspan font-size="9" dy="-5">z</tspan></text>` : '';
    }
    const [x, y] = P(this.fi, this.fj), [bx, by] = P(this.bi, this.bj);
    this.charG.setAttribute('transform', `translate(${f1(x)},${f1(y + 2)}) scale(${.46 * this.face},.46)`);
    this.budG.setAttribute('transform', `translate(${f1(bx)},${f1(by + 2)}) scale(${.4 * this.face},.4)`);
    this.bubG.setAttribute('transform', `translate(${f1(x)},${f1(y - 44)})`);
  },
  placeAll(){ this.place(this.charG, this.fi + this.fj + .01); this.place(this.budG, this.bi + this.bj + .01); },
  place(el, d){
    const layer = el.parentNode; if (!layer) return;
    let ref = null;
    for (const c of layer.children){ if (c.classList && c.classList.contains('obj') && +c.dataset.d > d){ ref = c; break; } }
    let nx = el.nextElementSibling; while (nx && !(nx.classList && nx.classList.contains('obj'))) nx = nx.nextElementSibling;
    if (nx !== ref) layer.insertBefore(el, ref);
  }
};
(function loop(ts){ try { sim.tick(ts); } catch (e) { console.error(e); } requestAnimationFrame(loop); })(0);

    const it = kid.inv.splice(idx, 1)[0];
    kid.world.push({ id: it.id, t: it.t, i, j });
    if (!kid.inv.some(o => o.t === ui.buildSel)) ui.buildSel = null;
    save(); render();
    const svg = $('#worldMain'); if (svg){ const [x, y] = P(i, j); svg.querySelector('#fxLayer').innerHTML = [0, 1, 2, 3, 4, 5].map(k => `<path class="twinkle ${['', 'd2', 'd3'][k % 3]}" d="${starPath(x + Math.cos(k) * 30, y - 30 + Math.sin(k) * 22, 6, 2.2, 4)}" fill="#FFE36B"/>`).join(''); setTimeout(() => { const f = svg.querySelector('#fxLayer'); if (f) f.innerHTML = ''; }, 1600); }
  },
  storeObj(el){ const kid = K(); const k = kid.world.findIndex(o => o.id === el.dataset.id); const [o] = kid.world.splice(k, 1); kid.inv.push({ id: o.id, t: o.t }); closeSheet(); save(); render(); },
  look(el){ const kid = K(); kid.char[el.dataset.f] = el.dataset.v; render(); },
  setBuddy(el){ K().buddy = el.dataset.v; render(); toast(`${BUDDIES[el.dataset.v].name} is walking with you now!`); },
  // ---- parent
  stars(el){ ui.appr[el.dataset.id].stars = +el.dataset.v; render(); },
  bonus(el){ ui.appr[el.dataset.id].bonus = +el.dataset.v; render(); },
  approve(el){
    const t = S.tasks.find(x => x.id === el.dataset.id), kid = kidOf(t.kid), p = payout(t);
    kid.coins += p.total; t.status = 'approved'; t.stars = p.a.stars; t.paid = p.total;
    kid.strength = clamp(kid.strength + 12, 0, 100);
    addHist(kid.id, 'earn', p.total, t.title + ' ' + '★'.repeat(p.a.stars));
    if (todays(kid.id).every(x => x.status === 'approved') && kid.streakDay !== dayKey()){ kid.streak++; kid.streakDay = dayKey(); }
    S.cele[kid.id].push({ amount: p.total, stars: p.a.stars, label: `${pname()} approved “${t.title}”!` });
    delete ui.appr[t.id]; save(); render();
    toast(`Sent ${p.total} coins to ${esc(kid.name)}.`, { title: 'Approved', icon: headBox(kid.char), btn: `<button class="btn small sun" data-act="seeKid" data-v="${kid.id}">See it</button>`, ms: 6000 });
  },
  sendBack(el){ const t = S.tasks.find(x => x.id === el.dataset.id); t.status = 'todo'; S.nudges[t.kid].push(`${pname()} says “${t.title}” needs a little more. You've got this!`); save(); render(); toast(`Sent back to ${esc(kidOf(t.kid).name)} with a kind note.`, { icon: headBox(kidOf(t.kid).char) }); },
  reqYes(el){ const r = S.requests.find(x => x.id === el.dataset.id), kid = kidOf(r.kid), it = CAT[r.item]; grant(kid, it); S.requests = S.requests.filter(x => x !== r); S.nudges[kid.id].push(`${pname()} said yes to the ${it.name}! Check your ${it.kind === 'place' ? 'build bag' : 'Buddies page'}.`); save(); render(); toast(`${esc(kid.name)} got the ${esc(it.name)}.`, { icon: headBox(kid.char) }); },
  reqNo(el){ const r = S.requests.find(x => x.id === el.dataset.id); S.requests = S.requests.filter(x => x !== r); S.nudges[r.kid].push(`${pname()} said not right now for the ${CAT[r.item].name}. Let's keep saving!`); save(); render(); },
  pk(el){ ui.pk = el.dataset.v; render(); },
  nudge(el){ const t = S.tasks.find(x => x.id === el.dataset.id); t.reminded = Date.now(); const B = BUDDIES[kidOf(t.kid).buddy]; S.nudges[t.kid].push(`Hey! “${t.title}” is waiting. Do it soon and we keep our energy!`); save(); render(); toast(`${B.name} reminded ${esc(kidOf(t.kid).name)}. In the real app the ${S.settings.grace}-minute grace period runs before anything is lost.`, { icon: budBox(kidOf(t.kid).buddy, { cheer: 1 }), ms: 5200 }); },
  lose(el){
    const t = S.tasks.find(x => x.id === el.dataset.id), kid = kidOf(t.kid);
    const lost = kid.lost[dayKey()] || 0, amt = Math.max(0, Math.min(t.penalty, S.settings.lossCap - lost, kid.coins));
    openSheet(`<div class="grab"></div><div><h3>Count “${esc(t.title)}” as missed?</h3><p class="sub">${esc(kid.name)} got a reminder ${ago(t.reminded)}.</p></div>
    <div class="breakdown"><div><span>Penalty you set</span><span>${t.penalty}</span></div><div><span>Lost today so far</span><span>${lost} of ${S.settings.lossCap}</span></div><div><span>Coins ${esc(kid.name)} has</span><span>${kid.coins}</span></div><div class="tot"><span>Coins removed</span><span>${amt}</span></div></div>
    <p class="note-s">${esc(kid.name)}'s character also loses some energy and works slower until the next quest. Items already bought stay.</p>
    <div class="actions"><button class="btn ghost" data-act="skipLoss" data-id="${t.id}">Miss, no coin loss</button><button class="btn red" data-act="confirmLoss" data-id="${t.id}" data-amt="${amt}">Remove ${amt}</button></div>`);
  },
  confirmLoss(el){ A.miss(el, +el.dataset.amt); },
  skipLoss(el){ A.miss(el, 0); },
  miss(el, amt){
    const t = S.tasks.find(x => x.id === el.dataset.id), kid = kidOf(t.kid);
    t.status = 'missed'; kid.coins -= amt; kid.lost[dayKey()] = (kid.lost[dayKey()] || 0) + amt;
    kid.strength = clamp(kid.strength - 20, 0, 100); kid.streak = 0;
    if (amt) addHist(kid.id, 'loss', amt, 'Missed ' + t.title);
    S.nudges[kid.id].push(`We missed “${t.title}” today${amt ? ` and lost ${amt} coins` : ''}. I'm a bit sleepy. One quest and we're back!`);
    closeSheet(); save(); render();
  },
  newTask(){ ui.draft = { isNew: true, kid: ui.pk === 'all' ? S.active : ui.pk, title: '', icon: 'paw', coins: 8, penalty: 2, due: '18:00', repeat: 'daily', days: [DOW], act: 'home', example: null }; openSheet(taskSheet()); },
  editTask(el){ const t = S.tasks.find(x => x.id === el.dataset.id); ui.draft = { ...t, days: [...(t.days || [])], isNew: false }; openSheet(taskSheet()); },
  dk(el){ ui.draft.kid = el.dataset.v; const kid = kidOf(ui.draft.kid); if (ui.draft.act !== 'home' && !placed(kid, ACT[ui.draft.act].b)) ui.draft.act = 'home'; openSheet(taskSheet()); },
  dIcon(el){ ui.draft.icon = el.dataset.v; openSheet(taskSheet()); },
  dRep(el){ ui.draft.repeat = el.dataset.v; if (!ui.draft.days.length) ui.draft.days = [DOW]; openSheet(taskSheet()); },
  dDay(el){ const d = +el.dataset.v, a = ui.draft.days; ui.draft.days = a.includes(d) ? a.filter(x => x !== d) : [...a, d]; openSheet(taskSheet()); },
  dAct(el){ ui.draft.act = el.dataset.v; openSheet(taskSheet()); },
  step(el){ const f = el.dataset.f; ui.draft[f] = clamp(ui.draft[f] + +el.dataset.v, 0, 99); $(f === 'coins' ? '#dCoins' : '#dPen').textContent = ui.draft[f]; },
  saveTask(){
    const d = ui.draft;
    if (!d.title.trim()) { $('#dTitle').focus(); return toast('Give the task a title first.', { icon: CAM }); }
    if ((d.repeat === 'weekly' || d.repeat === 'custom') && !d.days.length) return toast('Pick at least one day.');
    const { isNew, ...t } = d; t.title = t.title.trim();
    if (isNew){ S.tasks.push({ ...t, id: uid(), status: 'todo' }); } else { const k = S.tasks.findIndex(x => x.id === t.id); S.tasks[k] = { ...S.tasks[k], ...t }; }
    closeSheet(); save(); render(); toast(isNew ? `Added “${esc(t.title)}” for ${esc(kidOf(t.kid).name)}.` : 'Task saved.', { icon: headBox(kidOf(t.kid).char) });
  },
  delTask(){ S.tasks = S.tasks.filter(x => x.id !== ui.draft.id); closeSheet(); save(); render(); toast('Task deleted.'); },
  tog(el){ const k = el.dataset.k; S.settings[k] = !S.settings[k]; if (k === 'screenOn') ui.screenOk = false; render(); },
  reset(){ openSheet(`<div class="grab"></div><h3>Start the demo over?</h3><p class="sub">This puts back Ava, Leo and the sample tasks. Anything you changed is cleared.</p><div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn red" data-act="resetYes">Reset demo</button></div>`); },
  resetYes(){ S = seed(); ui.firstNudge = false; ui.appr = {}; sim.kid = null; closeSheet(); render(); toast('Demo reset.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && ui.draft) ui.draft[el.dataset.f] = el.value;
  if (el.dataset.set){ const k = el.dataset.set; if (k === 'parentName') S.parentName = el.value.trim() || 'Parent'; else S.settings[k] = el.type === 'number' ? Math.max(0, +el.value || 0) : el.value; save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.photo && el.files && el.files[0]) readPhoto(el.files[0], url => { if (el.dataset.photo === 'done'){ ui.done.photo = url; openSheet(doneSheet()); } else { ui.draft.example = url; openSheet(taskSheet()); } });
  if (el.dataset.set && S.mode === 'parent') render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });

injectDefs();
render();
</script>

</html>
